<!DOCTYPE html><html lang=en><head><meta charset=UTF-8><meta name=viewport content='width=device-width,initial-scale=1'><title>Dungeon Demo</title><style>:root{--bg:#0b0f1a;--panel:rgba(20,28,46,.72);--gold:#f5c97a;--cyan:#5fd3e0;--ink:#dfe7f5;--soft:#9fb0c9;--line:rgba(122,150,200,.25)}*{box-sizing:border-box;margin:0;padding:0}html,body{height:100%;background:radial-gradient(1200px 700px at 70% -10%,#1a2440 0%,var(--bg) 55%) fixed;color:var(--ink);font-family:PingFang SC,Microsoft YaHei,system-ui,sans-serif}body{padding:16px;overflow:auto}header{display:flex;align-items:baseline;gap:12px;margin-bottom:12px}h1{font-size:19px;color:var(--gold)}.layout{display:grid;grid-template-columns:1fr 260px;gap:14px;align-items:start}.stage{position:relative;height:480px;border:1px solid var(--line);border-radius:14px;overflow:hidden;background:linear-gradient(180deg,#101a2e 0%,#0c1222 100%)}canvas{position:absolute;inset:0;width:100%;height:100%;display:block}.panel{border:1px solid var(--line);border-radius:14px;background:var(--panel);padding:14px;font-size:13px}.panel h2{font-size:14px;color:var(--gold);margin-bottom:10px}.row{display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px dashed var(--line);font-size:12px}.row .m{color:var(--soft)}.btn{margin-top:8px;width:100%;padding:9px;border:1px solid var(--cyan);color:var(--cyan);background:rgba(95,211,224,.08);border-radius:9px;cursor:pointer;font-size:13px}.btn:hover{background:rgba(95,211,224,.18)}.msg{margin-top:10px;min-height:20px;font-size:12px;color:#3ddc84}.log{margin-top:8px;font-size:11px;color:var(--soft);max-height:90px;overflow:auto}</style></head><body><header><h1>Dungeon Demo</h1></header><div class=layout><div class=stage id=stage><canvas id=cv></canvas></div><div class=panel><h2>Dungeon Status</h2><div class=row><span class=m>Floor</span><span id=floorInfo>-</span></div><div class=row><span class=m>Room</span><span id=roomInfo>-</span></div><div class=row><span class=m>Gold</span><span id=goldInfo>0</span></div><button class=btn id=enterFloorBtn>Enter Dungeon</button><button class=btn id=enterRoomBtn style=display:none>Enter Room</button><div class=msg id=msg></div><div class=log id=log></div></div></div>
<script src=/src/data/physics-bank.js></script>
<script src=/src/data/chemistry-bank.js></script>
<script src=/src/data/math-bank.js></script>
<script src=/src/data/geography-bank.js></script>
<script src=/src/data/chinese-bank.js></script>
<script src=/src/data/english-bank.js></script>
<script type=module>// dungeon demo module script: driven by the S1b dungeon generator + M1 battle engine
const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
const $ = id => document.getElementById(id);
function fitCanvas() {
  const stage = document.getElementById('stage');
  const dpr = window.devicePixelRatio || 1;
  cv.width = stage.clientWidth * dpr; cv.height = stage.clientHeight * dpr;
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.cw = stage.clientWidth; ctx.ch = stage.clientHeight;
}
fitCanvas(); window.addEventListener('resize', fitCanvas);

const boot = {
  log() {}, register() {}, on() {}, emit() {},
  bus: { on() {}, emit() {} },
  state: {
    _st: { version:'v5', player:{ level:1, stats:{ atk:20, def:8, maxHp:100, maxMp:30, speed:10, hp:100 }, position:{x:0,y:0} }, knowledge:{}, world:{} },
    get() { return this._st; }, set(p) { Object.assign(this._st, p); }
  },
  render: { camera: { set(){} } },
  effects: { burst(){}, shake(){}, flash(){}, combo(){}, floatText(){}, answerFeedback(){} },
};

const dungeon = { floor: null, room: null, fightActive: false, fightResult: null, _answered: false, msg: 'Click Enter Dungeon' };

function setMsg(s) { dungeon.msg = s; $('msg').textContent = s; }

// mount modules: state/save/world/input/effects/knowledge/battle/economy
const mods = await Promise.all([
  import('/v5/core/state/index.js'), import('/v5/core/save/index.js'),
  import('/v5/core/world/index.js'), import('/v5/core/input/index.js'),
  import('/v5/core/effects/index.js'), import('/v5/core/knowledge/index.js'),
  import('/v5/core/battle/index.js'), import('/v5/core/economy/index.js')
]);
const [stateMod, saveMod, worldMod, inputMod, effectsMod, knowledgeMod, battleMod, economyMod] = mods;
stateMod.installState(boot); saveMod.installSave(boot); worldMod.installWorld(boot);
inputMod.installInput(boot); effectsMod.installEffects(boot); knowledgeMod.installKnowledge(boot);
economyMod.installEconomy(boot); battleMod.installBattle(boot);
if (boot.input && boot.input.attach) { try { boot.input.attach(); } catch(e) {} }

function log(s) { const el = $('log'); el.textContent += s + '\n'; el.scrollTop = el.scrollHeight; }

// draw room
function drawRoom() {
  const W = ctx.cw, H = ctx.ch;
  const pad = 12, cols = 16, rows = 10;
  const cellW = (W - pad*2) / cols, cellH = (H - pad*2) / rows;
  ctx.clearRect(0,0,W,H); ctx.fillStyle = '#0c1222'; ctx.fillRect(0,0,W,H);
  for (let x=0;x<cols;x++) for (let y=0;y<rows;y++) {
    ctx.fillStyle = (x+y)%2 ? '#12203a' : '#0e1a30';
    ctx.fillRect(pad + x*cellW, pad + y*cellH, cellW, cellH);
  }
  // draw current floor info
  ctx.fillStyle = '#f5c97a'; ctx.font = 'bold 18px sans-serif'; ctx.textAlign='center';
  const fl = dungeon.floor;
  const info = fl ? 'Floor ' + fl.depth + ' · Room ' + (fl.rooms.findIndex(r=>r.cleared)+1) + '/' + fl.rooms.length : 'No floor';
  ctx.fillText(info, W/2, H - 30);
  ctx.fillStyle = '#dfe7f5'; ctx.font = '14px sans-serif';
  ctx.fillText(dungeon.msg, W/2, H - 8);
}

function refreshHud() {
  const fl = dungeon.floor;
  if (!fl) { $('floorInfo').textContent = '-'; $('roomInfo').textContent = '-'; return; }
  $('floorInfo').textContent = 'Depth ' + fl.depth;
  const cur = boot.world.getCurrentRoom();
  if (cur) {
    $('roomInfo').textContent = 'Room ' + (fl.rooms.findIndex(r=>r.id===cur.id)+1) + '/' + fl.rooms.length + ' [' + cur.type + ']';
  }
  const st = boot.state.get();
  $('goldInfo').textContent = (st.player && st.player.gold) || 0;
}

function doEnterFloor() {
  dungeon.floor = boot.world.enterFloor({ depth: 1, seed: Date.now() >>> 0 });
  dungeon.fightActive = false; dungeon.fightResult = null;
  const cur = boot.world.getCurrentRoom();
  setMsg('Floor ' + dungeon.floor.depth + ' · ' + dungeon.floor.rooms.length + ' rooms. First: ' + (cur ? cur.type : '?'));
  log('Entered dungeon floor ' + dungeon.floor.depth);
  drawRoom(); refreshHud();
  $('enterRoomBtn').style.display = 'inline-block';
  $('enterFloorBtn').style.display = 'none';
}

function doEnterRoom() {
  const room = boot.world.getCurrentRoom();
  if (!room) { setMsg('No more rooms.'); return; }
  if (room.type === 'start' || room.type === 'rest') {
    setMsg('Safe room. You recover.');
    if (room.type === 'rest') { log('Rest: +' + Math.round((room.healPct||0.3)*100) + '% HP recovery'); }
    boot.world.advanceRoom(); drawRoom(); refreshHud(); return;
  }
  if (room.type === 'treasure') {
    const loot = boot.world.applyRoomLoot(room.id, 0);
    setMsg('Treasure! ' + (loot.gold||0) + ' gold' + (loot.pills.length ? ' + ' + loot.pills.join(',') : ''));
    log('Loot: ' + JSON.stringify(loot));
    boot.world.advanceRoom(); drawRoom(); refreshHud(); return;
  }
  // combat/boss room
  const enc = room.enemy || { kind:'ram', difficulty:'easy' };
  const bRoom = boot.world.spawnBattleRoom({});
  const r = boot.battle.startEncounter(enc, bRoom);
  if (!r.ok) { setMsg('Failed to start battle: ' + r.msg); return; }
  dungeon.fightActive = true; dungeon.fightResult = null;
  setMsg('Battle! ' + r.monster.name + ' HP:' + r.monster.hp);
  log('Battle start: ' + r.monster.name);
  $('enterRoomBtn').style.display = 'none';
  dungeon.encounterRef = r;
}

// simple fight loop
let _raf=null, _last=0;
function tickDriver(now) {
  _raf = requestAnimationFrame(tickDriver);
  const dt = _last ? (now - _last)/1000 : 0.016; _last = now;
  if (dungeon.fightActive) {
    // hold X (brace) every frame to crack during collision window
    window.dispatchEvent(new KeyboardEvent('keydown',{key:'x'}));
    boot.battle.update({dt});
    const st = boot.battle.getState();
    if (st.phase === 'stance') {
      boot.battle.resolveAttack('strike');
    }
    if (st.phase === 'question' && !dungeon._answered) {
      const q = st.question || st.current;
      if (q && q.answer) {
        dungeon._answered = true;
        boot.battle.doAnswer(q.answer);
      }
    }
    const st2 = boot.battle.getState();
    if (st2.phase === 'victory' || st2.phase === 'defeat') {
      dungeon.fightActive = false;
      dungeon._answered = false;
      if (st2.phase === 'victory') {
        const room = boot.world.getCurrentRoom();
        if (room) {
          boot.world.applyRoomLoot(room.id, st2.combo || 0);
          if (room.type === 'boss') {
            dungeon.floor = boot.world.enterFloor({depth: dungeon.floor.depth+1, seed: Date.now()>>>0});
            setMsg('Boss defeated! Floor ' + dungeon.floor.depth);
          } else {
            boot.world.advanceRoom();
            setMsg('Victory! Loot collected.');
          }
        }
      } else {
        setMsg('Defeated! Try again.');
      }
      dungeon.fightResult = st2.phase;
      $('enterRoomBtn').style.display = 'inline-block';
    }
  }
  drawRoom(); refreshHud();
}
_raf = requestAnimationFrame(tickDriver);

$('enterFloorBtn').addEventListener('click', doEnterFloor);
$('enterRoomBtn').addEventListener('click', doEnterRoom);
setMsg('Ready. Click Enter Dungeon to begin.');
log('Dungeon demo loaded.' + Object.keys(boot).join(', '));</script>
</body></html>
