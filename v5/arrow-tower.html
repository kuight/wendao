<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Arrow Tower</title><style>*{margin:0;padding:0;box-sizing:border-box}html,body{width:100%;height:100%;overflow:hidden;background:#0b0f1a}canvas{display:block}#hud{position:fixed;top:10px;left:10px;z-index:10;background:rgba(10,16,30,.88);border:1px solid rgba(122,150,200,.3);border-radius:10px;padding:8px 14px;color:#dfe7f5;font:12px Microsoft YaHei,sans-serif;pointer-events:none}#hud b{color:#f5c97a}</style></head><body><canvas id="cv"></canvas><div id="hud">Wave <b id="rd">1</b> HP <b id="hp">100</b> <span style="font-size:10px;color:#9fb0c9">WASD dodge missiles</span></div><script>(function(){var cv=document.getElementById("cv"),ctx=cv.getContext("2d");var W=800,H=600,CELL=40;function rs(){W=window.innerWidth||800;H=window.innerHeight||600;cv.width=W;cv.height=H;CELL=Math.floor(Math.max(30,Math.min(W/16,H/12)))}rs();window.addEventListener("resize",rs);var P={x:7,y:6,hp:100,mhp:100};var keys={};window.addEventListener("keydown",function(e){keys[e.key.toLowerCase()]=true;e.preventDefault()});window.addEventListener("keyup",function(e){keys[e.key.toLowerCase()]=false});var RW=14,RH=10;function walk(x,y){return x>=0&&x<RW&&y>=0&&y<RH}var towers=[],wave=1,cd=3,cdMax=3,missiles=[],msg="",msgT=0;function spawn(){towers=[];missiles=[];var n=wave===1?1:wave===2?2:3;for(var i=0;i<n;i++){towers.push({x:2+i*5,y:1,v0:3+wave,a:0.5*wave,cd:3,label:"v0="+(3+wave)+" a="+(0.5*wave).toFixed(1)})}cd=3;cdMax=3;msg="Wave "+wave;msgT=1.5}function update(dt){cd-=dt;msgT=Math.max(0,msgT-dt);if(cd<=0){for(var i=0;i<towers.length;i++){var t=towers[i];var tf=2,dist=t.v0*tf+0.5*t.a*tf*tf,lx=t.x+dist,ly=1+dist*0.3;missiles.push({x:t.x,y:t.y,vx:(lx-t.x)/tf,vy:(ly-t.y)/tf,life:tf,lx:lx,ly:ly})}cd=cdMax;msg="Dodge!";msgT=0.8}for(var i=missiles.length-1;i>=0;i--){var m=missiles[i];m.x+=m.vx*dt;m.y+=m.vy*dt;m.life-=dt;if(Math.hypot(m.x-P.x,m.y-P.y)<1){P.hp-=15;msg="HIT! Land=("+m.lx.toFixed(1)+","+m.ly.toFixed(1)+")";msgT=2;missiles.splice(i,1);if(P.hp<=0){P.hp=P.mhp;wave=1;spawn()}}else if(m.life<=0){missiles.splice(i,1)}}var dx=0,dy=0;if(keys["w"]||keys["arrowup"])dy=-1;if(keys["s"]||keys["arrowdown"])dy=1;if(keys["a"]||keys["arrowleft"])dx=-1;if(keys["d"]||keys["arrowright"])dx=1;if(dx||dy){var spd=6*dt,nx=P.x+dx*spd,ny=P.y+dy*spd;if(walk(nx,ny)){P.x=nx;P.y=ny}}if(missiles.length===0&&cd<cdMax-1){wave++;if(wave>3){wave=1;P.hp=P.mhp;msg="CLEAR!";msgT=2}spawn()}}function draw(){ctx.clearRect(0,0,W,H);ctx.fillStyle="#0b0f1a";ctx.fillRect(0,0,W,H);for(var y=0;y<RH;y++)for(var x=0;x<RW;x++){ctx.fillStyle=(x+y)%2?"#12203a":"#0e1a30";ctx.fillRect(x*CELL,y*CELL,CELL,CELL)}for(var i=0;i<towers.length;i++){var t=towers[i];ctx.fillStyle="#f44";ctx.fillRect(t.x*CELL-CELL*.3,t.y*CELL-CELL*.3,CELL*.6,CELL*.6);ctx.fillStyle="#fff";ctx.font="10px sans-serif";ctx.textAlign="center";ctx.fillText("T",t.x*CELL,t.y*CELL+3);ctx.fillStyle="#9fb0c9";ctx.font="8px sans-serif";ctx.fillText(t.label,t.x*CELL,t.y*CELL-CELL*.35)}for(var i=0;i<missiles.length;i++){var m=missiles[i];ctx.fillStyle="#ff0";ctx.beginPath();ctx.arc(m.x*CELL,m.y*CELL,CELL*.12,0,Math.PI*2);ctx.fill();ctx.fillStyle="rgba(255,0,0,.15)";ctx.beginPath();ctx.arc(m.lx*CELL,m.ly*CELL,CELL*.4,0,Math.PI*2);ctx.fill()}ctx.fillStyle="#f5c97a";ctx.beginPath();ctx.arc(P.x*CELL,P.y*CELL,CELL*.3,0,Math.PI*2);ctx.fill();var bw=W*.5,bh=14,bx=(W-bw)/2,by=H-30;ctx.fillStyle="#222";ctx.fillRect(bx,by,bw,bh);ctx.fillStyle="#5fd3e0";ctx.fillRect(bx,by,bw*(cd/cdMax),bh);ctx.fillStyle="#fff";ctx.font="10px sans-serif";ctx.textAlign="center";ctx.fillText(cd.toFixed(1)+"s",W/2,by+bh/2+3);if(msgT>0){ctx.fillStyle="#dfe7f5";ctx.font="bold 16px sans-serif";ctx.textAlign="center";ctx.fillText(msg,W/2,H-50)}document.getElementById("rd").textContent=wave;document.getElementById("hp").textContent=Math.floor(P.hp)}spawn();var lt=0;function loop(t){var dt=Math.min(.05,lt?(t-lt)/1000:.016);lt=t;update(dt);draw();requestAnimationFrame(loop)}requestAnimationFrame(loop)})();</script></body></html>
