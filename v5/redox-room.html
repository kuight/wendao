<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Redox Room</title><style>*{margin:0;padding:0;box-sizing:border-box}html,body{width:100%;height:100%;overflow:hidden;background:#0b0f1a}canvas{display:block;cursor:crosshair}#hud{position:fixed;top:10px;left:10px;z-index:10;background:rgba(10,16,30,.88);border:1px solid rgba(122,150,200,.3);border-radius:10px;padding:8px 14px;color:#dfe7f5;font:12px Microsoft YaHei,sans-serif;pointer-events:none}#hud b{color:#f5c97a}</style></head><body><canvas id="cv"></canvas><div id="hud">Lvl <b id="lv">1</b> Score <b id="sc">0</b> <span style="font-size:10px;color:#9fb0c9">drag blue(pool loses e-) to purple(pool gains e-)</span></div><script>(function(){var cv=document.getElementById("cv"),ctx=cv.getContext("2d");var W=800,H=600;function rs(){W=window.innerWidth||800;H=window.innerHeight||600;cv.width=W;cv.height=H}rs();window.addEventListener("resize",rs);var st={lvl:1,score:0,msg:"",msgT:0,done:false};var pools=[],links=[],parts=[],drag={on:false,x:0,y:0,from:null};var R=40;function poolColor(p){return p.lost?"#f44":p.type==="red"?"#4fc3f7":"#9c27b0"}function def(n){if(n===1)return{red:[{x:200,y:300}],ox:[{x:600,y:300}]};if(n===2)return{red:[{x:150,y:240},{x:150,y:360}],ox:[{x:650,y:240},{x:650,y:360}]};if(n===3)return{red:[{x:150,y:250},{x:150,y:350}],ox:[{x:650,y:300}]};return{red:[{x:150,y:200},{x:150,y:300},{x:150,y:400}],ox:[{x:650,y:250},{x:650,y:350}]}}function init(n){var d=def(n);st.lvl=n;st.done=false;st.msg="";st.msgT=0;pools=[];links=[];parts=[];drag={on:false,x:0,y:0,from:null};d.red.forEach(function(p){pools.push({type:"red",x:p.x,y:p.y,lost:false})});d.ox.forEach(function(p){pools.push({type:"ox",x:p.x,y:p.y,got:false})});document.getElementById("lv").textContent=n}function fail(t){st.msg=t;st.msgT=1.2}function tryLink(a,b){if(a.type==="ox"&&b.type==="red"){fail("electrons flow REDUCER(blue)->OXIDIZER(purple)");return}if(a.type==="red"&&b.type==="ox"){if(a.lost||b.got){fail("this pool already balanced");return}a.lost=true;b.got=true;links.push({ax:a.x,ay:a.y,bx:b.x,by:b.y});for(var i=0;i<12;i++)parts.push({x:a.x,y:a.y,ex:b.x,ey:b.y,t:i/12,d:.6});st.score+=100;st.msg="e- transferred! +100";st.msgT=.8;checkDone()}}function checkDone(){var all=pools.every(function(p){return p.type==="red"?p.lost:p.got});if(all){st.done=true;st.score+=500;st.msg="REDOX BALANCED! N=next";st.msgT=99}}function update(dt){st.msgT=Math.max(0,st.msgT-dt);for(var i=parts.length-1;i>=0;i--){var p=parts[i];p.t+=dt/p.d;if(p.t>=1)parts.splice(i,1)}}function draw(){ctx.clearRect(0,0,W,H);ctx.fillStyle="#0b0f1a";ctx.fillRect(0,0,W,H);for(var y=0;y<15;y++)for(var x=0;x<20;x++){ctx.fillStyle=(x+y)%2?"#10142a":"#0c1020";ctx.fillRect(x*40,y*40,40,40)}for(var i=0;i<links.length;i++){var l=links[i];ctx.strokeStyle="#ffd700";ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(l.ax,l.ay);ctx.lineTo(l.bx,l.by);ctx.stroke()}for(var i=0;i<parts.length;i++){var p=parts[i];ctx.fillStyle="#ff0";ctx.beginPath();ctx.arc(p.x+(p.ex-p.x)*p.t,p.y+(p.ey-p.y)*p.t,4,0,Math.PI*2);ctx.fill()}for(var i=0;i<pools.length;i++){var p=pools[i];ctx.fillStyle=poolColor(p);ctx.beginPath();ctx.arc(p.x,p.y,R,0,Math.PI*2);ctx.fill();ctx.strokeStyle="#fff";ctx.lineWidth=2;ctx.stroke();ctx.fillStyle="#fff";ctx.font="bold 9px sans-serif";ctx.textAlign="center";ctx.fillText(p.type==="red"?"REDUCER(e- out)":"OXIDIZER(e- in)",p.x,p.y+4)}if(drag.on){ctx.strokeStyle="rgba(255,255,255,.5)";ctx.lineWidth=2;ctx.setLineDash([6,4]);ctx.beginPath();ctx.moveTo(drag.x,drag.y);ctx.lineTo(drag.from.x,drag.from.y);ctx.stroke();ctx.setLineDash([])}if(st.msgT>0){ctx.fillStyle=st.done?"#3ddc84":"#dfe7f5";ctx.font="bold 16px sans-serif";ctx.textAlign="center";ctx.fillText(st.msg,W/2,H-30)}document.getElementById("sc").textContent=st.score}function poolAt(x,y){for(var i=0;i<pools.length;i++){var p=pools[i];if(Math.hypot(x-p.x,y-p.y)<R+10)return p}return null}cv.addEventListener("mousedown",function(e){var r=cv.getBoundingClientRect();var x=e.clientX-r.left,y=e.clientY-r.top;var h=poolAt(x,y);if(h){drag.on=true;drag.x=x;drag.y=y;drag.from=h}});cv.addEventListener("mousemove",function(e){if(drag.on){var r=cv.getBoundingClientRect();drag.x=e.clientX-r.left;drag.y=e.clientY-r.top}});cv.addEventListener("mouseup",function(e){if(!drag.on)return;var r=cv.getBoundingClientRect();var x=e.clientX-r.left,y=e.clientY-r.top;var h=poolAt(x,y);if(h&&h!==drag.from)tryLink(drag.from,h);drag.on=false});window.addEventListener("keydown",function(e){var k=e.key.toLowerCase();if(st.done&&k==="n")init(st.lvl+1);if(k==="r"){st.score=0;init(1)}});init(1);var lt=0;function loop(t){var dt=Math.min(.05,lt?(t-lt)/1000:.016);lt=t;update(dt);draw();requestAnimationFrame(loop)}requestAnimationFrame(loop)})();</script></body></html>
