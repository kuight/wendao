</div><script>
const cv=document.getElementById('cv'),ctx=cv.getContext('2d');
let W,H,CELL=40;function rs(){cv.width=innerWidth;cv.height=innerHeight;W=cv.width;H=cv.height}rs();addEventListener('resize',()=>{rs()});
const GAP=1,RW=10,RH=7,BOXRW=15,BOXH=11,GRID=4;
const D={depth:1,state:'title',rooms:[],map:[],mw:0,mh:0,player:{x:0,y:0,hp:100,mhp:100,atk:12,gold:0,dir:{x:0,y:1},dodgeCd:0,hitCd:0,atkCd:0,shootCd:0},enemies:[],projectiles:[],pickups:[],particles:[],floats:[],cam:{x:0,y:0,tx:0,ty:0,roomId:null,transT:0,transDur:0.35},msg:'',msgT:0,kills:0,goldGot:0,roomsDone:0,autoTarget:null};
function genFloor(d){const G=1,RW=10,RH=7,GR=4,BW=15,BH=11;const lo={},pa=[];for(let cx=0;cx<GR;cx++){pa.push([cx,1]);lo[cx+',1']=true}if(Math.random()>.4){const bx=1+Math.floor(Math.random()*2);pa.push([bx,0]);lo[bx+',0']=true}if(Math.random()>.4){const bx=1+Math.floor(Math.random()*2);pa.push([bx,2]);lo[bx+',2']=true}const rl=Object.keys(lo).map(k=>k.split(',').map(Number));rl.sort((a,b)=>a[0]-b[0]||a[1]-b[1]);const rooms=[];for(let i=0;i<rl.length;i++){const[gx,gy]=rl[i];const isBoss=i===rl.length-1;const w=isBoss?BW:RW,h=isBoss?BH:RH;const r={x:gx*(RW+G),y:gy*(RH+G),w,h,type:isBoss?'boss':i===0?'start':(Math.random()<.2?'treasure':'combat'),cleared:false,enemies:[],doors:[],pickups:[]};if(r.type==='boss'){r.enemies.push({rx:r.x+r.w/2,ry:r.y+3,hp:500,mhp:500,atk:28,type:'boss',name:'RhinoKing',icon:'R',alive:true,speed:0.7,shootCd:0,shootInt:2.5})}else if(r.type==='combat'){const n=1+Math.floor(Math.random()*(1+d));const ts=['basic','basic','charger','shooter'];for(let j=0;j<n;j++){const t=ts[Math.floor(Math.random()*ts.length)];const e={rx:r.x+2+Math.random()*(w-4),ry:r.y+2+Math.random()*(h-4),type:t,alive:true,speed:t==='charger'?3:t==='shooter'?0.8:1.2,shootCd:0,shootInt:2.5};if(t==='charger'){e.hp=60+d*20;e.mhp=e.hp;e.atk=12+d*2;e.name='Charger';e.icon='C'}else if(t==='shooter'){e.hp=35+d*12;e.mhp=e.hp;e.atk=7+d;e.name='Bat';e.icon='B'}else{e.hp=75+d*25;e.mhp=e.hp;e.atk=9+d*2;e.name='Beast';e.icon='E'}r.enemies.push(e)}}if(r.type==='treasure')r.pickups.push({rx:r.x+r.w/2,ry:r.y+r.h-2,type:'hp',val:35});if(r.type!=='start'&&r.type!=='boss'&&Math.random()<.3)r.pickups.push({rx:r.x+2+Math.random()*(w-4),ry:r.y+2+Math.random()*(h-4),type:'hp',val:20});rooms.push(r)}const mw=GR*(RW+G)+G,mh=Math.max(3*(RH+G)+G,rooms.reduce((m,r)=>Math.max(m,r.y+r.h+1),0));const map=Array.from({length:mh},()=>Array(mw).fill(0));for(const r of rooms)for(let y=r.y;y<r.y+r.h;y++)for(let x=r.x;x<r.x+r.w;x++)map[y][x]=2;for(let i=0;i<rooms.length;i++)for(let j=i+1;j<rooms.length;j++){const a=rooms[i],b=rooms[j];if(Math.abs(a.x/(RW+G)-b.x/(RW+G))+Math.abs(a.y/(RH+G)-b.y/(RH+G))!==1)continue;let dx,dy;if(Math.abs(a.x/(RW+G)-b.x/(RW+G))===1){const L=a.x<b.x?a:b,R=a.x<b.x?b:a;dx=L.x+L.w;dy=Math.floor((a.y+b.y)/2+Math.min(a.h,b.h)/2)}else{const T=a.y<b.y?a:b,B=a.y<b.y?b:a;dx=Math.floor((a.x+b.x)/2+Math.min(a.w,b.w)/2);dy=T.y+T.h}if(dx>=0&&dy>=0&&dx<mw&&dy<mh){map[dy][dx]=4;a.doors.push({x:dx,y:dy,open:true});b.doors.push({x:dx,y:dy,open:true})}}return{rooms,map,mw,mh}}
function initFloor(d){const g=genFloor(d);D.depth=d;D.rooms=g.rooms;D.map=g.map;D.mw=g.mw;D.mh=g.mh;CELL=Math.floor(Math.min(W/(BOXRW+3),H/(BOXH+3)));if(CELL<28)CELL=28;if(CELL>60)CELL=60;D.enemies=g.rooms.flatMap(r=>r.enemies);D.pickups=g.rooms.flatMap(r=>r.pickups||[]);D.projectiles=[];D.particles=[];D.floats=[];D.bossDefeated=false;D.atkCd=0;D.shootCd=0;D.msg='';D.msgT=0;const r0=g.rooms[0];D.player.x=r0.x+3;D.player.y=r0.y+3;D.player.hp=D.player.mhp;D.cam.x=r0.x+r0.w/2;D.cam.y=r0.y+r0.h/2;D.cam.tx=D.cam.x;D.cam.ty=D.cam.y;D.cam.roomId=0;D.cam.transT=0;D.state='play'}
const keys={};addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;e.preventDefault()});addEventListener('keyup',e=>{keys[e.key.toLowerCase()]=false});
function sp(x,y,c,n){for(let i=0;i<n;i++)D.particles.push({x,y,vx:(Math.random()-.5)*4,vy:(Math.random()-.5)*4-1,life:1,color:c})}
function sf(x,y,t,c){D.floats.push({x,y,text:t,color:c,life:1})}
function roomAt(x,y){return D.rooms.find(r=>x>=r.x&&x<r.x+r.w&&y>=r.y&&y<r.y+r.h)||null}
function curRoom(){return D.cam.roomId!=null?D.rooms[D.cam.roomId]:roomAt(D.player.x,D.player.y)}
function doorOpen(x,y){for(const r of D.rooms)for(const d of r.doors)if(d.x===x&&d.y===y)return d.open;return true}
function walkable(x,y){if(x<0||y<0||x>=D.mw||y>=D.mh)return false;const t=D.map[y][x];if(t===2)return true;if(t===4)return doorOpen(x,y);return false}
function autoTarget(cone,maxR){const p=D.player;let best=null,bd=Infinity;const r=curRoom();if(!r)return null;for(const e of r.enemies){if(!e.alive)continue;const dx=e.rx-p.x,dy=e.ry-p.y;const dist=Math.hypot(dx,dy);if(dist>maxR)continue;const dot=(dx*p.dir.x+dy*p.dir.y)/dist;const ang=Math.acos(Math.max(-1,Math.min(1,dot)));if(ang<cone/2&&dist<bd){best=e;bd=dist}}return best}
function update(dt){if(D.state!=='play')return;const p=D.player;p.atkCd=Math.max(0,p.atkCd-dt);p.shootCd=Math.max(0,p.shootCd-dt);p.hitCd=Math.max(0,p.hitCd-dt);p.dodgeCd=Math.max(0,p.dodgeCd-dt);D.msgT=Math.max(0,D.msgT-dt);let dx=0,dy=0;if(keys['w']||keys['arrowup'])dy=-1;if(keys['s']||keys['arrowdown'])dy=1;if(keys['a']||keys['arrowleft'])dx=-1;if(keys['d']||keys['arrowright'])dx=1;if(dx||dy){p.dir={x:dx,y:dy};const spd=6.5*dt;const nx=p.x+dx*spd,ny=p.y+dy*spd;if(walkable(Math.floor(nx),Math.floor(ny))){p.x=nx;p.y=ny}}if(keys['shift']&&p.dodgeCd<=0&&(dx||dy)){p.dodgeCd=1.5;p.hitCd=0.35;const bx=p.x+dx*3,by=p.y+dy*3;if(walkable(Math.floor(bx),Math.floor(by))){p.x=bx;p.y=by}sp(p.x*CELL,p.y*CELL,'#5fd3e0',8)}D.autoTarget=autoTarget(Math.PI/3,12);if(keys['k']&&p.atkCd<=0){p.atkCd=0.35;sp(p.x*CELL,p.y*CELL,'#f5c97a',10);const t=autoTarget(Math.PI,2.8);if(t){const dmg=p.atk+Math.floor(Math.random()*6);t.hp-=dmg;sp(t.rx*CELL,t.ry*CELL,'#ff6b6b',6);sf(t.rx*CELL,t.ry*CELL,'-'+dmg,'#ff6b6b');if(t.hp<=0){t.alive=false;const g=12+D.depth*6;D.player.gold+=g;D.kills++;D.goldGot+=g;sp(t.rx*CELL,t.ry*CELL,'#ffd700',14);sf(t.rx*CELL,t.ry*CELL,'+'+g+'G','#ffd700')}}}if(keys['j']&&p.shootCd<=0){p.shootCd=0.5;const t=autoTarget(Math.PI/3,14);const spd=8;if(t){const d=Math.hypot(t.rx-p.x,t.ry-p.y)||1;D.projectiles.push({x:p.x,y:p.y,vx:(t.rx-p.x)/d*spd,vy:(t.ry-p.y)/d*spd,life:2,dmg:p.atk*0.55,isEnemy:false,target:t})}else{const d=p.dir||{x:0,y:1};D.projectiles.push({x:p.x,y:p.y,vx:d.x*spd,vy:d.y*spd,life:1.2,dmg:p.atk*0.5,isEnemy:false})}}for(let i=D.projectiles.length-1;i>=0;i--){const pr=D.projectiles[i];if(pr.target&&pr.target.alive){const d=Math.hypot(pr.target.rx-pr.x,pr.target.ry-pr.y)||1;const spd=8;pr.vx=(pr.target.rx-pr.x)/d*spd;pr.vy=(pr.target.ry-pr.y)/d*spd}pr.x+=pr.vx*dt;pr.y+=pr.vy*dt;pr.life-=dt;const gx=Math.floor(pr.x),gy=Math.floor(pr.y);if(gx<0||gx>=D.mw||gy<0||gy>=D.mh||D.map[gy][gx]===0){D.projectiles.splice(i,1);continue}if(pr.isEnemy){if(Math.hypot(pr.x-p.x,pr.y-p.y)<0.8){p.hp-=pr.dmg;if(p.hitCd<=0){p.hitCd=0.3;sp(p.x*CELL,p.y*CELL,'#ff0000',3);sf(p.x*CELL,p.y*CELL,'-'+Math.floor(pr.dmg),'#ff0000')}D.projectiles.splice(i,1);if(p.hp<=0){p.hp=0;D.state='defeat';D.msg='R restart'}}}else{const r2=curRoom();if(r2&&!r2.cleared)for(const e of r2.enemies){if(!e.alive)continue;if(Math.hypot(pr.x-e.rx,pr.y-e.ry)<1.3){const dmg=pr.dmg;e.hp-=dmg;sp(e.rx*CELL,e.ry*CELL,'#ff6b6b',5);sf(e.rx*CELL,e.ry*CELL,'-'+Math.floor(dmg),'#ff6b6b');if(e.hp<=0){e.alive=false;const g=12+D.depth*6;D.player.gold+=g;D.kills++;D.goldGot+=g;sp(e.rx*CELL,e.ry*CELL,'#ffd700',12);sf(e.rx*CELL,e.ry*CELL,'+'+g+'G','#ffd700')}D.projectiles.splice(i,1);break}}}if(pr.life<=0)D.projectiles.splice(i,1)}const r=curRoom();if(r&&!r.cleared){for(const e of r.enemies){if(!e.alive)continue;const d=Math.hypot(e.rx-p.x,e.ry-p.y);if(e.type==='boss'){if(d<10){const sp=e.speed*dt;const nx=e.rx+(p.x-e.rx)/d*sp,ny=e.ry+(p.y-e.ry)/d*sp;if(walkable(Math.floor(nx),Math.floor(ny))){e.rx=nx;e.ry=ny}}e.shootCd-=dt;if(e.shootCd<=0&&d<12){e.shootCd=e.shootInt;D.projectiles.push({x:e.rx,y:e.ry,vx:(p.x-e.rx)/d*5,vy:(p.y-e.ry)/d*5,life:2,dmg:e.atk,isEnemy:true})}}else if(e.type==='charger'){if(d<9){const sp=e.speed*3*dt;const nx=e.rx+(p.x-e.rx)/d*sp,ny=e.ry+(p.y-e.ry)/d*sp;if(walkable(Math.floor(nx),Math.floor(ny))){e.rx=nx;e.ry=ny}}}else if(e.type==='shooter'){if(d>3&&d<10){const sp=.8*dt;const nx=e.rx+(p.x-e.rx)/d*sp,ny=e.ry+(p.y-e.ry)/d*sp;if(walkable(Math.floor(nx),Math.floor(ny))){e.rx=nx;e.ry=ny}}else if(d<=3){const sp=-1.2*dt;const nx=e.rx+(p.x-e.rx)/d*sp,ny=e.ry+(p.y-e.ry)/d*sp;if(walkable(Math.floor(nx),Math.floor(ny))){e.rx=nx;e.ry=ny}}e.shootCd-=dt;if(e.shootCd<=0&&d<9){e.shootCd=e.shootInt;D.projectiles.push({x:e.rx,y:e.ry,vx:(p.x-e.rx)/d*3.5,vy:(p.y-e.ry)/d*3.5,life:2,dmg:e.atk,isEnemy:true})}}else{if(d>0.8&&d<8){const sp=e.speed*dt;const nx=e.rx+(p.x-e.rx)/d*sp,ny=e.ry+(p.y-e.ry)/d*sp;if(walkable(Math.floor(nx),Math.floor(ny))){e.rx=nx;e.ry=ny}}}}if(p.hitCd<=0)for(const e of r.enemies){if(!e.alive)continue;if(Math.hypot(e.rx-p.x,e.ry-p.y)<1.1){p.hp-=e.atk;p.hitCd=0.4;sp(p.x*CELL,p.y*CELL,'#ff0000',3);sf(p.x*CELL,p.y*CELL,'-'+e.atk,'#ff0000');if(p.hp<=0){p.hp=0;D.state='defeat';D.msg='R restart'}break}}if(r.enemies.every(e=>!e.alive)){r.cleared=true;D.roomsDone++;for(const d of r.doors)d.open=true;if(r.type==='boss'){D.bossDefeated=true;D.msg='BOSS defeated! N next';D.msgT=3}else{D.msg='Room cleared!';D.msgT=1.2}}}const nr=roomAt(D.player.x,D.player.y);if(nr&&nr!==r){const idx=D.rooms.indexOf(nr);if(idx>=0){D.cam.roomId=idx;D.cam.transT=D.cam.transDur}if((nr.type==='combat'||nr.type==='boss')&&!nr.cleared){for(const d of nr.doors)d.open=false;D.msg=nr.type==='boss'?'BOSS FIGHT!':'FIGHT!';D.msgT=1.5}}for(let i=D.pickups.length-1;i>=0;i--){const pk=D.pickups[i];if(Math.hypot(pk.rx-p.x,pk.ry-p.y)<1.2){if(pk.type==='hp'){p.hp=Math.min(p.mhp,p.hp+pk.val);sf(pk.rx*CELL,pk.ry*CELL,'+'+pk.val+'HP','#3ddc84')}D.pickups.splice(i,1)}}if(D.bossDefeated&&keys['n']){keys['n']=false;initFloor(D.depth+1)}if(D.state==='defeat'&&keys['r']){keys['r']=false;initFloor(1)}D.cam.transT=Math.max(0,D.cam.transT-dt);const cr=curRoom();if(cr){if(D.cam.transT>0){const k=1-Math.pow(0.001,dt);D.cam.x+=(cr.x+cr.w/2-D.cam.x)*k;D.cam.y+=(cr.y+cr.h/2-D.cam.y)*k}else{const dz=Math.min(W,H)*0.18/CELL;const offX=p.x-D.cam.x,offY=p.y-D.cam.y;if(Math.abs(offX)>dz)D.cam.tx=p.x-Math.sign(offX)*dz;if(Math.abs(offY)>dz)D.cam.ty=p.y-Math.sign(offY)*dz;D.cam.tx=Math.max(cr.x+cr.w/2-W/CELL/2+2,Math.min(cr.x+cr.w/2+W/CELL/2-2,D.cam.tx));D.cam.ty=Math.max(cr.y+cr.h/2-H/CELL/2+2,Math.min(cr.y+cr.h/2+H/CELL/2-2,D.cam.ty));const k=1-Math.pow(0.001,dt);D.cam.x+=(D.cam.tx-D.cam.x)*k;D.cam.y+=(D.cam.ty-D.cam.y)*k}}for(let i=D.particles.length-1;i>=0;i--){const pt=D.particles[i];pt.x+=pt.vx;pt.y+=pt.vy;pt.life-=dt*2;if(pt.life<=0)D.particles.splice(i,1)}for(let i=D.floats.length-1;i>=0;i--){const ft=D.floats[i];ft.y-=50*dt;ft.life-=dt*1.2;if(ft.life<=0)D.floats.splice(i,1)}}
function draw(){ctx.clearRect(0,0,W,H);ctx.fillStyle='#0b0f1a';ctx.fillRect(0,0,W,H);if(D.state==='title'){ctx.fillStyle='#f5c97a';ctx.font='bold 38px sans-serif';ctx.textAlign='center';ctx.fillText('Thunder Hall',W/2,H/2-40);ctx.fillStyle='#dfe7f5';ctx.font='18px sans-serif';ctx.fillText('ENTER to start',W/2,H/2+10);return}const ox=W/2-D.cam.x*CELL,oy=H/2-D.cam.y*CELL;const cr2=curRoom();if(cr2){const rx=cr2.x-2,ry=cr2.y-2,rx2=cr2.x+cr2.w+2,ry2=cr2.y+cr2.h+2;for(let y=Math.max(0,ry);y<Math.min(D.mh,ry2);y++)for(let x=Math.max(0,rx);x<Math.min(D.mw,rx2);x++){const t=D.map[y][x];if(t===0)continue;const sx=ox+x*CELL,sy=oy+y*CELL;if(sx<-CELL||sx>W+CELL||sy<-CELL||sy>H+CELL)continue;if(t===2){ctx.fillStyle=(x+y)%2?'#12203a':'#0e1a30';ctx.fillRect(sx,sy,CELL,CELL)}else if(t===4){ctx.fillStyle=doorOpen(x,y)?'#2a4a2a':'#442222';ctx.fillRect(sx,sy,CELL,CELL)}}}for(const rm of D.rooms){if(rm.type==='boss'&&!rm.cleared){const sx=ox+rm.x*CELL,sy=oy+(rm.y-1.5)*CELL;ctx.fillStyle='rgba(255,100,100,.8)';ctx.font='bold 14px sans-serif';ctx.textAlign='center';ctx.fillText('BOSS',sx+rm.w*CELL/2,sy)}}for(const e of D.enemies){if(!e.alive)continue;const sx=ox+e.rx*CELL,sy=oy+e.ry*CELL;if(e===D.autoTarget){ctx.strokeStyle='rgba(255,215,0,.5)';ctx.lineWidth=2;ctx.beginPath();ctx.arc(sx,sy,CELL*.45,0,Math.PI*2);ctx.stroke()}ctx.fillStyle=e.type==='boss'?'#f44':e.type==='charger'?'#f84':e.type==='shooter'?'#a6c':'#c63';ctx.beginPath();ctx.arc(sx,sy,CELL*.3,0,Math.PI*2);ctx.fill();ctx.fillStyle='#fff';ctx.font=Math.floor(CELL*.35)+'px sans-serif';ctx.textAlign='center';ctx.fillText(e.icon,sx,sy+3);if(e.hp<e.mhp){const bw=CELL*.45;ctx.fillStyle='rgba(0,0,0,.5)';ctx.fillRect(sx-bw/2,sy-CELL*.45,bw,3);ctx.fillStyle='#f44';ctx.fillRect(sx-bw/2,sy-CELL*.45,bw*(e.hp/e.mhp),3)}}for(const pr of D.projectiles){const sx=ox+pr.x*CELL,sy=oy+pr.y*CELL;ctx.fillStyle=pr.isEnemy?'#f44':'#5fd3e0';ctx.beginPath();ctx.arc(sx,sy,CELL*.07,0,Math.PI*2);ctx.fill()}for(const pk of D.pickups){const sx=ox+pk.rx*CELL,sy=oy+pk.ry*CELL;ctx.fillStyle=pk.type==='hp'?'#3d8':'#fc7';ctx.fillRect(sx-CELL*.15,sy-CELL*.15,CELL*.3,CELL*.3)}const px=ox+D.player.x*CELL,py=oy+D.player.y*CELL;if(D.player.dodgeCd>1.2){ctx.fillStyle='rgba(95,211,224,.2)';ctx.beginPath();ctx.arc(px,py,CELL*.5,0,Math.PI*2);ctx.fill()}ctx.fillStyle='#fc7';ctx.beginPath();ctx.arc(px,py,CELL*.3,0,Math.PI*2);ctx.fill();ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(px,py,3,0,Math.PI*2);ctx.fill();for(const pt of D.particles){ctx.globalAlpha=pt.life;ctx.fillStyle=pt.color;ctx.beginPath();ctx.arc(ox+pt.x,oy+pt.y,3*pt.life,0,Math.PI*2);ctx.fill()}ctx.globalAlpha=1;for(const ft of D.floats){ctx.globalAlpha=ft.life;ctx.fillStyle=ft.color;ctx.font='bold 12px sans-serif';ctx.textAlign='center';ctx.fillText(ft.text,ox+ft.x,oy+ft.y)}ctx.globalAlpha=1;if(D.msgT>0){ctx.fillStyle='#dfe7f5';ctx.font='bold 18px sans-serif';ctx.textAlign='center';ctx.fillText(D.msg,W/2,H-20)}if(D.state==='victory'){ctx.fillStyle='rgba(0,0,0,.6)';ctx.fillRect(0,0,W,H);ctx.fillStyle='#fd0';ctx.font='bold 36px sans-serif';ctx.textAlign='center';ctx.fillText('CLEARED!',W/2,H/2-20);ctx.fillStyle='#dfe7f5';ctx.font='16px sans-serif';ctx.fillText('Kills:'+D.kills+' Gold:'+D.goldGot,W/2,H/2+20);ctx.fillText('N=next floor',W/2,H/2+50)}if(D.state==='defeat'){ctx.fillStyle='rgba(0,0,0,.5)';ctx.fillRect(0,0,W,H);ctx.fillStyle='#f66';ctx.font='bold 30px sans-serif';ctx.textAlign='center';ctx.fillText('DEFEATED',W/2,H/2-15);ctx.fillText('Kills:'+D.kills+' Gold:'+D.goldGot,W/2,H/2+20);ctx.fillText('R=restart',W/2,H/2+48)}}
function hud(){const p=D.player;document.getElementById('d').textContent=D.depth;const cl=D.rooms.filter(r=>r.cleared).length;document.getElementById('r').textContent=(cl+1)+'/'+D.rooms.length;document.getElementById('hp').textContent=Math.floor(p.hp);document.getElementById('g').textContent=p.gold}
