<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>问道 v5 · 雷霆殿</title><style>
*{margin:0;padding:0;box-sizing:border-box}html,body{width:100%;height:100%;overflow:hidden;background:#0b0f1a}
canvas{display:block;width:100%;height:100%}
#hud{position:fixed;top:12px;left:12px;z-index:10;background:rgba(10,16,30,.88);border:1px solid rgba(122,150,200,.3);border-radius:10px;padding:8px 14px;color:#dfe7f5;font:12px Microsoft YaHei,sans-serif;pointer-events:none}
#hud b{color:#f5c97a}#hud .hp{color:#3ddc84}
</style></head><body><canvas id="cv"></canvas><div id="hud">
Fl<b id="fDepth">1</b> <b id="fRoom">1/6</b> HP<b id="fHp" class="hp">100</b> G<b id="fGold">0</b>
<span style="font-size:10px;color:#9fb0c9">WASD走 K砍 J射 Shift闪</span>
</div>
<script>
const cv=document.getElementById('cv'),ctx=cv.getContext('2d');
let W,H;function rs(){cv.width=innerWidth;cv.height=innerHeight;W=cv.width;H=cv.height}rs();addEventListener('resize',rs);
const CELL=36;const D={depth:1,state:'title',rooms:[],map:[],mw:0,mh:0,player:{x:0,y:0,hp:100,mhp:100,atk:10,gold:0,dir:{x:0,y:1},dodgeCd:0,hitCd:0,atkCd:0,shootCd:0},enemies:[],projectiles:[],pickups:[],particles:[],floats:[],cam:{x:0,y:0,tx:0,ty:0,roomId:null},msg:'',msgT:0,kills:0,goldGot:0,roomsDone:0};

// === PROVEN room generation ===
function genFloor(depth){
 const GAP=1,RW=8,RH=6,GRID=4,BOXRW=13,BOXH=10;
 const layout={},path=[];
 // main horizontal backbone: [0,1]->[1,1]->[2,1]->[3,1] (4 cols, row 1)
 for(let cx=0;cx<GRID;cx++){path.push([cx,1]);layout[cx+',1']=true}
 // branches off main path
 if(Math.random()>.4){const bx=1+Math.floor(Math.random()*2);path.push([bx,0]);layout[bx+',0']=true}
 if(Math.random()>.4){const bx=1+Math.floor(Math.random()*2);path.push([bx,2]);layout[bx+',2']=true}
 const roomList=Object.keys(layout).map(k=>k.split(',').map(Number));roomList.sort((a,b)=>a[0]-b[0]||a[1]-b[1]);
 const rooms=[];
 for(let i=0;i<roomList.length;i++){
  const[gx,gy]=roomList[i];const isBoss=i===roomList.length-1;
  const w=isBoss?BOXRW:RW,h=isBoss?BOXH:RH;
  const r={x:gx*(RW+GAP),y:gy*(RH+GAP),w,h,type:isBoss?'boss':i===0?'start':(Math.random()<.2?'treasure':'combat'),cleared:false,enemies:[],doors:[],pickups:[]};
  // enemies
  if(r.type==='boss'){r.enemies.push({rx:r.x+r.w/2,ry:r.y+2,hp:400,mhp:400,atk:24,type:'boss',name:'犀牛·王',icon:'🦏',alive:true,speed:0.7,shootCd:0,shootInt:3})}
  else if(r.type==='combat'){const n=1+Math.floor(Math.random()*2);const ts=['basic','basic','charger'];for(let j=0;j<n;j++){const t=ts[Math.floor(Math.random()*ts.length)];const e={rx:r.x+2+Math.random()*(w-4),ry:r.y+2+Math.random()*(h-4),type:t,alive:true,speed:t==='charger'?2.2:1,shootCd:0,shootInt:3};if(t==='charger'){e.hp=55+depth*15;e.mhp=e.hp;e.atk=10+depth*2;e.name='冲刺兽';e.icon='🐗'}else{e.hp=70+depth*20;e.mhp=e.hp;e.atk=8+depth*2;e.name='妖兽';e.icon='👹'}r.enemies.push(e)}}
  if(r.type==='treasure')r.pickups.push({rx:r.x+r.w/2,ry:r.y+r.h-1,type:'hp',val:30});
  rooms.push(r)
 }
 const mw=GRID*(RW+GAP)+GAP,mh=Math.max(3*(RH+GAP)+GAP,rooms.reduce((m,r)=>Math.max(m,r.y+r.h+1),0));
 const map=Array.from({length:mh},()=>Array(mw).fill(0));
 for(const r of rooms)for(let y=r.y;y<r.y+r.h;y++)for(let x=r.x;x<r.x+r.w;x++)map[y][x]=2;
 // doors: one per cardinal-adjacent pair
 for(let i=0;i<rooms.length;i++)for(let j=i+1;j<rooms.length;j++){
  const a=rooms[i],b=rooms[j];
  if(Math.abs(a.x/(RW+GAP)-b.x/(RW+GAP))+Math.abs(a.y/(RH+GAP)-b.y/(RH+GAP))!==1)continue;
  let dx,dy;
  if(Math.abs(a.x/(RW+GAP)-b.x/(RW+GAP))===1){const left=a.x<b.x?a:b,right=a.x<b.x?b:a;dx=left.x+left.w;dy=Math.floor((a.y+b.y)/2+Math.min(a.h,b.h)/2)}
  else{const top=a.y<b.y?a:b,bottom=a.y<b.y?b:a;dx=Math.floor((a.x+b.x)/2+Math.min(a.w,b.w)/2);dy=top.y+top.h}
  if(dx>=0&&dy>=0&&dx<mw&&dy<mh){map[dy][dx]=4;a.doors.push({x:dx,y:dy,open:true});b.doors.push({x:dx,y:dy,open:true})}
 }
 return{rooms,map,mw,mh}
}

function initFloor(depth){
 const g=genFloor(depth);D.depth=depth;D.rooms=g.rooms;D.map=g.map;D.mw=g.mw;D.mh=g.mh;
 D.enemies=g.rooms.flatMap(r=>r.enemies);D.pickups=g.rooms.flatMap(r=>r.pickups||[]);
 D.projectiles=[];D.particles=[];D.floats=[];D.bossDefeated=false;D.atkCd=0;D.shootCd=0;D.msg='';D.msgT=0;
 const r0=g.rooms[0];D.player.x=r0.x+r0.w/2;D.player.y=r0.y+r0.h/2;D.player.hp=D.player.mhp;
 D.cam.x=r0.x+r0.w/2;D.cam.y=r0.y+r0.h/2;D.cam.tx=D.cam.x;D.cam.ty=D.cam.y;D.cam.roomId=0;D.state='play';
}
// === input ===
const keys={};addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;e.preventDefault()});addEventListener('keyup',e=>{keys[e.key.toLowerCase()]=false});
// === helpers ===
function sp(x,y,c,n){for(let i=0;i<n;i++)D.particles.push({x,y,vx:(Math.random()-.5)*4,vy:(Math.random()-.5)*4-1,life:1,color:c})}
function sf(x,y,t,c){D.floats.push({x,y,text:t,color:c,life:1})}
function dmgEnemy(e,dmg){e.hp-=dmg;sp(e.rx*CELL,e.ry*CELL,'#ff6b6b',5);sf(e.rx*CELL,e.ry*CELL,'-'+Math.floor(dmg),'#ff6b6b');if(e.hp<=0){e.alive=false;const g=10+D.depth*5;D.player.gold+=g;D.kills++;D.goldGot+=g;sp(e.rx*CELL,e.ry*CELL,'#ffd700',12);sf(e.rx*CELL,e.ry*CELL,'+'+g+'G','#ffd700')}}
function roomAt(x,y){return D.rooms.find(r=>x>=r.x&&x<r.x+r.w&&y>=r.y&&y<r.y+r.h)||null}
function curRoom(){return D.cam.roomId!=null?D.rooms[D.cam.roomId]:roomAt(D.player.x,D.player.y)}
function doorOpen(x,y){for(const r of D.rooms)for(const d of r.doors)if(d.x===x&&d.y===y)return d.open;return true}
function walkable(x,y){if(x<0||y<0||x>=D.mw||y>=D.mh)return false;const t=D.map[y][x];if(t===2)return true;if(t===4)return doorOpen(x,y);return false}
// === update ===
function update(dt){
 if(D.state!=='play')return;const p=D.player;
 p.atkCd=Math.max(0,p.atkCd-dt);p.shootCd=Math.max(0,p.shootCd-dt);p.hitCd=Math.max(0,p.hitCd-dt);p.dodgeCd=Math.max(0,p.dodgeCd-dt);D.msgT=Math.max(0,D.msgT-dt);
 let dx=0,dy=0;if(keys['w']||keys['arrowup'])dy=-1;if(keys['s']||keys['arrowdown'])dy=1;if(keys['a']||keys['arrowleft'])dx=-1;if(keys['d']||keys['arrowright'])dx=1;
 if(dx||dy){p.dir={x:dx,y:dy};const nx=p.x+dx*7*dt,ny=p.y+dy*7*dt;if(walkable(Math.floor(nx),Math.floor(ny))){p.x=nx;p.y=ny}}
 if(keys['shift']&&p.dodgeCd<=0&&(dx||dy)){p.dodgeCd=1.5;p.hitCd=0.4;sp(p.x*CELL,p.y*CELL,'#5fd3e0',6)}
 if(keys['k']&&p.atkCd<=0){p.atkCd=0.35;sp(p.x*CELL,p.y*CELL,'#f5c97a',8);const r=curRoom();if(r&&!r.cleared)for(const e of r.enemies){if(!e.alive)continue;if(Math.hypot(e.rx-p.x,e.ry-p.y)<2.2)dmgEnemy(e,p.atk+Math.floor(Math.random()*5))}}
 if(keys['j']&&p.shootCd<=0){p.shootCd=0.55;const d=p.dir||{x:0,y:1};D.projectiles.push({x:p.x,y:p.y,vx:d.x*9,vy:d.y*9,life:1.5,dmg:p.atk*0.6,isEnemy:false})}
 for(let i=D.projectiles.length-1;i>=0;i--){const pr=D.projectiles[i];pr.x+=pr.vx*dt;pr.y+=pr.vy*dt;pr.life-=dt;const gx=Math.floor(pr.x),gy=Math.floor(pr.y);if(gx<0||gx>=D.mw||gy<0||gy>=D.mh||D.map[gy][gx]===0){D.projectiles.splice(i,1);continue}
  if(pr.isEnemy){if(Math.hypot(pr.x-p.x,pr.y-p.y)<0.8){p.hp-=pr.dmg;if(p.hitCd<=0){p.hitCd=0.3;sp(p.x*CELL,p.y*CELL,'#ff0000',3);sf(p.x*CELL,p.y*CELL,'-'+Math.floor(pr.dmg),'#ff0000')}D.projectiles.splice(i,1);if(p.hp<=0){p.hp=0;D.state='defeat';D.msg='R restarts'}}}
  else{const r=curRoom();if(r&&!r.cleared)for(const e of r.enemies){if(!e.alive)continue;if(Math.hypot(pr.x-e.rx,pr.y-e.ry)<1.2){dmgEnemy(e,pr.dmg);D.projectiles.splice(i,1);break}}}
  if(pr.life<=0)D.projectiles.splice(i,1)}
 const r=curRoom();if(r&&!r.cleared){
  for(const e of r.enemies){if(!e.alive)continue;const d=Math.hypot(e.rx-p.x,e.ry-p.y);
   if(e.type==='boss'){if(d<8){const sp=e.speed*dt;const nx=e.rx+(p.x-e.rx)/d*sp,ny=e.ry+(p.y-e.ry)/d*sp;if(walkable(Math.floor(nx),Math.floor(ny))){e.rx=nx;e.ry=ny}}e.shootCd-=dt;if(e.shootCd<=0&&d<10){e.shootCd=e.shootInt;D.projectiles.push({x:e.rx,y:e.ry,vx:(p.x-e.rx)/d*4,vy:(p.y-e.ry)/d*4,life:2,dmg:e.atk,isEnemy:true})}}
   else if(e.type==='charger'){if(d<8){const sp=e.speed*3*dt;const nx=e.rx+(p.x-e.rx)/d*sp,ny=e.ry+(p.y-e.ry)/d*sp;if(walkable(Math.floor(nx),Math.floor(ny))){e.rx=nx;e.ry=ny}}}
   else{if(d>0.8&&d<7){const sp=e.speed*dt;const nx=e.rx+(p.x-e.rx)/d*sp,ny=e.ry+(p.y-e.ry)/d*sp;if(walkable(Math.floor(nx),Math.floor(ny))){e.rx=nx;e.ry=ny}}}
  }
  if(p.hitCd<=0)for(const e of r.enemies){if(!e.alive)continue;if(Math.hypot(e.rx-p.x,e.ry-p.y)<1){p.hp-=e.atk;p.hitCd=0.45;sp(p.x*CELL,p.y*CELL,'#ff0000',3);sf(p.x*CELL,p.y*CELL,'-'+e.atk,'#ff0000');if(p.hp<=0){p.hp=0;D.state='defeat';D.msg='R restarts'}break}}
  if(r.enemies.every(e=>!e.alive)){r.cleared=true;D.roomsDone++;for(const d of r.doors)d.open=true;if(r.type==='boss'){D.bossDefeated=true;D.msg='BOSS DEFEATED! N next floor';D.msgT=3}else{D.msg='Room cleared!';D.msgT=1.2}}
 }
 const nr=roomAt(D.player.x,D.player.y);if(nr&&nr!==r){const idx=D.rooms.indexOf(nr);if(idx>=0)D.cam.roomId=idx;if((nr.type==='combat'||nr.type==='boss')&&!nr.cleared){for(const d of nr.doors)d.open=false;D.msg=nr.type==='boss'?'BOSS FIGHT!':'FIGHT!';D.msgT=1.5}}
 for(let i=D.pickups.length-1;i>=0;i--){const pk=D.pickups[i];if(Math.hypot(pk.rx-p.x,pk.ry-p.y)<1.2){if(pk.type==='hp'){p.hp=Math.min(p.mhp,p.hp+pk.val);sf(pk.rx*CELL,pk.ry*CELL,'+'+pk.val+'HP','#3ddc84')}D.pickups.splice(i,1)}}
 if(D.bossDefeated&&keys['n']){keys['n']=false;initFloor(D.depth+1)}
 if(D.state==='defeat'&&keys['r']){keys['r']=false;initFloor(1)}
 const cr=curRoom();if(cr){D.cam.tx=cr.x+cr.w/2;D.cam.ty=cr.y+cr.h/2}else{D.cam.tx=D.player.x;D.cam.ty=D.player.y}
 D.cam.x=D.cam.tx;D.cam.y=D.cam.ty;
 for(let i=D.particles.length-1;i>=0;i--){const pt=D.particles[i];pt.x+=pt.vx;pt.y+=pt.vy;pt.life-=dt*2;if(pt.life<=0)D.particles.splice(i,1)}
 for(let i=D.floats.length-1;i>=0;i--){const ft=D.floats[i];ft.y-=40*dt;ft.life-=dt*1.2;if(ft.life<=0)D.floats.splice(i,1)}
}
// === draw ===
function draw(){
 ctx.clearRect(0,0,W,H);ctx.fillStyle='#0b0f1a';ctx.fillRect(0,0,W,H);
 if(D.state==='title'){ctx.fillStyle='#f5c97a';ctx.font='bold 36px Microsoft YaHei,sans-serif';ctx.textAlign='center';ctx.fillText('问道修仙学院',W/2,H/2-50);ctx.fillStyle='#dfe7f5';ctx.font='20px Microsoft YaHei,sans-serif';ctx.fillText('雷霆殿秘境',W/2,H/2-10);ctx.fillStyle='#9fb0c9';ctx.font='16px Microsoft YaHei,sans-serif';ctx.fillText('ENTER 进入地牢 WASD走 K砍 J射 Shift闪',W/2,H/2+40);return}
 const ox=W/2-D.cam.x*CELL,oy=H/2-D.cam.y*CELL;
 // tiles: only current room + 2 margin
 const cr2=curRoom();if(cr2){const rx=cr2.x-2,ry=cr2.y-2,rx2=cr2.x+cr2.w+2,ry2=cr2.y+cr2.h+2;for(let y=Math.max(0,ry);y<Math.min(D.mh,ry2);y++)for(let x=Math.max(0,rx);x<Math.min(D.mw,rx2);x++){const t=D.map[y][x];if(t===0)continue;const sx=ox+x*CELL,sy=oy+y*CELL;if(sx<-CELL||sx>W+CELL||sy<-CELL||sy>H+CELL)continue;if(t===2){ctx.fillStyle=(x+y)%2?'#12203a':'#0e1a30';ctx.fillRect(sx,sy,CELL,CELL)}else if(t===4){ctx.fillStyle=doorOpen(x,y)?'#2a4a2a':'#442222';ctx.fillRect(sx,sy,CELL,CELL)}}}else{for(let y=0;y<D.mh;y++)for(let x=0;x<D.mw;x++){const t=D.map[y][x];if(t===0)continue;const sx=ox+x*CELL,sy=oy+y*CELL;if(t===2)ctx.fillRect(sx,sy,CELL,CELL)}}
 // boss room label
 for(const r of D.rooms){if(r.type==='boss'&&!r.cleared){const sx=ox+r.x*CELL,sy=oy+(r.y-1)*CELL;ctx.fillStyle='rgba(255,100,100,.7)';ctx.font='bold 13px sans-serif';ctx.textAlign='center';ctx.fillText('BOSS',sx+r.w*CELL/2,sy)}}
 // enemies
 for(const e of D.enemies){if(!e.alive)continue;const sx=ox+e.rx*CELL,sy=oy+e.ry*CELL;ctx.fillStyle=e.type==='boss'?'#ff4444':e.type==='charger'?'#ff8844':'#cc6633';ctx.beginPath();ctx.arc(sx,sy,CELL*.32,0,Math.PI*2);ctx.fill();ctx.fillStyle='#fff';ctx.font=Math.floor(CELL*.4)+'px sans-serif';ctx.textAlign='center';ctx.fillText(e.icon,sx,sy+3);if(e.hp<e.mhp){const bw=CELL*.5;ctx.fillStyle='rgba(0,0,0,.5)';ctx.fillRect(sx-bw/2,sy-CELL*.45,bw,3);ctx.fillStyle='#ff4444';ctx.fillRect(sx-bw/2,sy-CELL*.45,bw*(e.hp/e.mhp),3)}}
 // projectiles
 for(const pr of D.projectiles){const sx=ox+pr.x*CELL,sy=oy+pr.y*CELL;ctx.fillStyle=pr.isEnemy?'#ff4444':'#5fd3e0';ctx.beginPath();ctx.arc(sx,sy,CELL*.07,0,Math.PI*2);ctx.fill();ctx.fillStyle='rgba(255,255,255,.4)';ctx.beginPath();ctx.arc(sx,sy,CELL*.13,0,Math.PI*2);ctx.fill()}
 // pickups
 for(const pk of D.pickups){const sx=ox+pk.rx*CELL,sy=oy+pk.ry*CELL;ctx.fillStyle=pk.type==='hp'?'#3ddc84':'#f5c97a';ctx.fillRect(sx-CELL*.16,sy-CELL*.16,CELL*.32,CELL*.32);ctx.fillStyle='#fff';ctx.font=Math.floor(CELL*.28)+'px sans-serif';ctx.textAlign='center';ctx.fillText('+',sx,sy+3)}
 // player
 const px=ox+D.player.x*CELL,py=oy+D.player.y*CELL;if(D.player.dodgeCd>1.2){ctx.fillStyle='rgba(95,211,224,.25)';ctx.beginPath();ctx.arc(px,py,CELL*.5,0,Math.PI*2);ctx.fill()}ctx.fillStyle='#f5c97a';ctx.beginPath();ctx.arc(px,py,CELL*.32,0,Math.PI*2);ctx.fill();ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(px,py,3,0,Math.PI*2);ctx.fill();
 // particles
 for(const pt of D.particles){ctx.globalAlpha=pt.life;ctx.fillStyle=pt.color;ctx.beginPath();ctx.arc(ox+pt.x,oy+pt.y,3*pt.life,0,Math.PI*2);ctx.fill()}ctx.globalAlpha=1;
 // floats
 for(const ft of D.floats){ctx.globalAlpha=ft.life;ctx.fillStyle=ft.color;ctx.font='bold 13px sans-serif';ctx.textAlign='center';ctx.fillText(ft.text,ox+ft.x,oy+ft.y)}ctx.globalAlpha=1;
 if(D.msgT>0||D.state==='defeat'){ctx.fillStyle=D.state==='defeat'?'#ff6b6b':'#dfe7f5';ctx.font='bold 20px sans-serif';ctx.textAlign='center';ctx.fillText(D.msg,W/2,H-30)}
 if(D.state==='victory'){ctx.fillStyle='rgba(0,0,0,.6)';ctx.fillRect(0,0,W,H);ctx.fillStyle='#ffd700';ctx.font='bold 40px sans-serif';ctx.textAlign='center';ctx.fillText('Cleared!',W/2,H/2-20);ctx.fillStyle='#dfe7f5';ctx.font='18px sans-serif';ctx.fillText('Kills:'+D.kills+' Gold:'+D.goldGot,W/2,H/2+25);ctx.fillText('Press N for next floor',W/2,H/2+55)}
 if(D.state==='defeat'){ctx.fillStyle='rgba(0,0,0,.5)';ctx.fillRect(0,0,W,H);ctx.fillStyle='#ff6b6b';ctx.font='bold 32px sans-serif';ctx.textAlign='center';ctx.fillText('Defeated',W/2,H/2-10);ctx.fillStyle='#dfe7f5';ctx.font='16px sans-serif';ctx.fillText('Kills:'+D.kills+' Gold:'+D.goldGot,W/2,H/2+20);ctx.fillText('Press R to restart',W/2,H/2+48)}
}
function hud(){const p=D.player;document.getElementById('fDepth').textContent=D.depth;const cl=D.rooms.filter(r=>r.cleared).length;document.getElementById('fRoom').textContent=(cl+1)+'/'+D.rooms.length;document.getElementById('fHp').textContent=Math.floor(p.hp);document.getElementById('fGold').textContent=p.gold}
let lt=0;
function loop(t){const dt=Math.min(.05,lt?(t-lt)/1000:.016);lt=t;
 if(D.state==='title'){if(keys['enter']){keys['enter']=false;initFloor(1)}draw();hud()}
 else if(D.state==='play'){update(dt);draw();hud();if(D.bossDefeated&&keys['n']){keys['n']=false;D.state='victory'}}
 else if(D.state==='victory'){draw();hud();if(keys['n']){keys['n']=false;initFloor(D.depth+1)}}
 else if(D.state==='defeat'){draw();hud();if(keys['r']){keys['r']=false;initFloor(1)}}
 requestAnimationFrame(loop)}
requestAnimationFrame(loop);
</script></body></html>
