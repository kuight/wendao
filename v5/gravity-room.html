<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gravity Room</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}html,body{width:100%;height:100%;overflow:hidden;background:#0b0f1a}
canvas{display:block}#hud{position:fixed;top:10px;left:10px;z-index:10;background:rgba(10,16,30,.88);border:1px solid rgba(122,150,200,.3);border-radius:10px;padding:8px 14px;color:#dfe7f5;font:12px Microsoft YaHei,sans-serif;pointer-events:none}#hud b{color:#f5c97a}
</style></head>
<body><canvas id="cv"></canvas>
<div id="hud">g=<b id="gf" style="color:#5fd3e0">1.0</b> HP=<b id="hp">100</b> <span style="font-size:10px;color:#9fb0c9">WASD K atk | g:3s cycle</span></div>
<script>
(function(){
var cv=document.getElementById('cv'),ctx=cv.getContext('2d');
var W=800,H=600,CELL=50;
function rs(){W=window.innerWidth||800;H=window.innerHeight||600;cv.width=W;cv.height=H;CELL=Math.floor(Math.max(30,Math.min(W/14,H/10)))}
rs();window.addEventListener('resize',rs);

var P={x:5,y:5,hp:100,mhp:100,atk:15,dir:{x:0,y:1}};
var gF=1.0,gT=3,msg='',msgT=0;
var keys={};window.addEventListener('keydown',function(e){keys[e.key.toLowerCase()]=true;e.preventDefault()});window.addEventListener('keyup',function(e){keys[e.key.toLowerCase()]=false});
var RW=10,RH=8;
function walk(x,y){return x>=0&&x<RW&&y>=0&&y<RH}
var enemy={x:7,y:4,hp:80,mhp:80,alive:true};

function update(dt){
  gT-=dt;if(gT<=0){gT=3;gF=gF===1?1.6:gF===1.6?0.6:1;msg='g='+gF.toFixed(1);msgT=1}
  msgT=Math.max(0,msgT-dt);
  var dx=0,dy=0;if(keys['w']||keys['arrowup'])dy=-1;if(keys['s']||keys['arrowdown'])dy=1;if(keys['a']||keys['arrowleft'])dx=-1;if(keys['d']||keys['arrowright'])dx=1;
  if(dx||dy){P.dir={x:dx,y:dy};var spd=7*dt/Math.sqrt(gF);var nx=P.x+dx*spd,ny=P.y+dy*spd;if(walk(nx,ny)){P.x=nx;P.y=ny}}
  if(keys['k']&&enemy.alive){var d=Math.hypot(enemy.x-P.x,enemy.y-P.y);if(d<2){var dmg=Math.floor((P.atk+Math.floor(Math.random()*6))*gF);enemy.hp-=dmg;msg='-'+dmg+' (g='+gF.toFixed(1)+')';msgT=0.8;if(enemy.hp<=0){enemy.hp=enemy.mhp;msg='KILLED!';msgT=2}}}
  if(enemy.alive&&Math.hypot(enemy.x-P.x,enemy.y-P.y)<1.2){P.hp-=8;if(P.hp<=0){P.hp=P.mhp;msg='DIED. Retry';msgT=2}}
}
function draw(){
  ctx.clearRect(0,0,W,H);ctx.fillStyle='#0b0f1a';ctx.fillRect(0,0,W,H);
  var vC=CELL*(gF>1.3?0.82:gF<0.8?1.18:1);
  for(var y=0;y<RH;y++)for(var x=0;x<RW;x++){
    ctx.fillStyle=gF>1.3?'#1a1a30':gF<0.8?'#2a3a1a':((x+y)%2?'#12203a':'#0e1a30');
    ctx.fillRect(x*CELL+(CELL-vC)/2,y*CELL+(CELL-vC)/2,vC,vC);
  }
  var barW=W*0.5,barH=16,bx=(W-barW)/2,by=H-36;
  ctx.fillStyle='#222';ctx.fillRect(bx,by,barW,barH);
  var pct=(gF-0.6)/(1.6-0.6);ctx.fillStyle=gF>1?'#ff6b6b':'#5fd3e0';ctx.fillRect(bx,by,barW*pct,barH);
  ctx.fillStyle='#fff';ctx.font='bold 12px sans-serif';ctx.textAlign='center';ctx.fillText('g='+gF.toFixed(1),W/2,by+barH/2+4);
  ctx.fillStyle='#f5c97a';var ps=gF>1.3?CELL*.24:gF<0.8?CELL*.38:CELL*.32;
  ctx.beginPath();ctx.arc(P.x*CELL+CELL/2,P.y*CELL+CELL/2,ps,0,Math.PI*2);ctx.fill();
  if(enemy.alive){ctx.fillStyle='#f44';ctx.beginPath();ctx.arc(enemy.x*CELL+CELL/2,enemy.y*CELL+CELL/2,CELL*.28,0,Math.PI*2);ctx.fill()}
  if(msgT>0){ctx.fillStyle='#dfe7f5';ctx.font='bold 18px sans-serif';ctx.textAlign='center';ctx.fillText(msg,W/2,H-60)}
  document.getElementById('gf').textContent=gF.toFixed(1);
  document.getElementById('hp').textContent=Math.floor(P.hp);
}
var lt=0;function loop(t){var dt=Math.min(.05,lt?(t-lt)/1000:.016);lt=t;update(dt);draw();requestAnimationFrame(loop)}requestAnimationFrame(loop);
})();
</script></body></html>
