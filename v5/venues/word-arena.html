<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>🌐 译灵堂 · 词汇对决</title>
<style>
:root {
  --ink: #0a0f1e; --ink2: #111833; --jade: #2ec4a0; --jade-l: #5ee0c0;
  --gold: #e8c15a; --gold-d: #c9a040; --crimson: #e05555; --paper: #eef3f0;
  --dim: #8899b0; --line: #1e3050; --blue: #5b9cf5; --blue-l: #8abfff;
  --purple: #9b7ef0; --purple-l: #c0a8ff;
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; }
body {
  font-family: "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", "Source Han Sans SC", system-ui, sans-serif;
  background: radial-gradient(1400px 800px at 50% 5%, #1a2a4a 0%, #0a0f1e 50%, #050810 100%);
  color: var(--paper); min-height: 100vh; overflow-x: hidden;
  display: flex; flex-direction: column; align-items: center;
}
.wrap { max-width: 960px; width: 100%; padding: 10px 14px 30px; flex: 1; display: flex; flex-direction: column; }

/* ===== Header ===== */
header {
  display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
  padding: 8px 0 10px; border-bottom: 1px solid var(--line); margin-bottom: 10px;
}
header h1 { font-size: clamp(18px, 3.5vw, 24px); letter-spacing: 3px; color: var(--gold);
  text-shadow: 0 0 20px rgba(232,193,90,.25); }
header .sub { font-size: 12px; color: var(--dim); margin-left: 4px; }
.hud {
  display: flex; gap: 10px; margin-left: auto; flex-wrap: wrap;
}
.hud-chip {
  background: linear-gradient(180deg, rgba(46,196,160,.15), rgba(46,196,160,.05));
  border: 1px solid var(--line); border-radius: 10px; padding: 6px 12px; text-align: center; min-width: 60px;
}
.hud-chip b { display: block; font-size: 16px; color: var(--gold); }
.hud-chip span { font-size: 10px; color: var(--dim); }

/* ===== Arena ===== */
#arena {
  display: flex; gap: 14px; flex: 1; align-items: stretch; flex-wrap: wrap;
}

/* ===== Fighter panels ===== */
.fighter {
  flex: 1 1 280px; min-width: 260px;
  background: linear-gradient(180deg, rgba(17,24,51,.85), rgba(10,15,30,.9));
  border: 1px solid var(--line); border-radius: 18px;
  padding: 16px; display: flex; flex-direction: column; align-items: center; gap: 10px;
  position: relative; overflow: hidden;
  box-shadow: 0 4px 30px rgba(0,0,0,.4);
}
.fighter.player { border-color: rgba(91,156,245,.4); box-shadow: 0 0 25px rgba(91,156,245,.1); }
.fighter.enemy  { border-color: rgba(224,85,85,.4); box-shadow: 0 0 25px rgba(224,85,85,.1); }

.fighter .avatar {
  width: 72px; height: 72px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center; font-size: 36px;
  flex: 0 0 auto;
}
.fighter.player .avatar { background: linear-gradient(135deg, #1a3a6a, #0f2244); border: 2px solid var(--blue); }
.fighter.enemy  .avatar { background: linear-gradient(135deg, #4a1a1a, #2a0f0f); border: 2px solid var(--crimson); }

.fighter .name {
  font-size: 16px; font-weight: 700; letter-spacing: 2px;
}
.fighter.player .name { color: var(--blue-l); }
.fighter.enemy  .name { color: #f08080; }

.hp-outer {
  width: 100%; height: 10px; background: rgba(255,255,255,.08);
  border-radius: 6px; overflow: hidden;
}
.hp-inner {
  height: 100%; border-radius: 6px; transition: width .35s ease;
}
.fighter.player .hp-inner { background: linear-gradient(90deg, #3b7ddd, #5b9cf5); box-shadow: 0 0 8px rgba(91,156,245,.5); }
.fighter.enemy  .hp-inner { background: linear-gradient(90deg, #c0392b, #e05555); box-shadow: 0 0 8px rgba(224,85,85,.5); }

.hp-text { font-size: 11px; color: var(--dim); }

/* ===== Center zone ===== */
#center-zone {
  flex: 1 1 340px; min-width: 300px;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 12px; padding: 10px 0;
}

#word-card {
  background: linear-gradient(180deg, rgba(20,30,60,.9), rgba(12,18,40,.95));
  border: 1px solid var(--gold); border-radius: 16px;
  padding: 20px 18px; text-align: center; width: 100%;
  box-shadow: 0 0 30px rgba(232,193,90,.12);
}
#word-card .en-word {
  font-size: clamp(26px, 5vw, 40px); font-weight: 800; letter-spacing: 2px;
  color: var(--gold); margin-bottom: 4px;
}
#word-card .phonetic {
  font-size: 13px; color: var(--jade-l); margin-bottom: 8px; font-style: italic;
}
#word-card .cn-hint {
  font-size: 14px; color: var(--dim);
}
#word-card .cn-hint b {
  color: var(--gold); font-size: 16px; background: rgba(232,193,90,.15);
  padding: 1px 6px; border-radius: 4px;
}

#timer-ring {
  width: 64px; height: 64px; position: relative; flex: 0 0 auto;
}
#timer-ring svg { transform: rotate(-90deg); }
#timer-ring .t-text {
  position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
  font-size: 20px; font-weight: 900;
}

#spell-input {
  width: 100%; max-width: 320px; padding: 12px 16px; border-radius: 12px;
  border: 2px solid var(--line); background: rgba(10,14,30,.8); color: #fff;
  font-size: 18px; text-align: center; letter-spacing: 2px; outline: none;
  transition: border-color .2s;
}
#spell-input:focus { border-color: var(--jade); box-shadow: 0 0 14px rgba(46,196,160,.3); }
#spell-input.wrong { border-color: var(--crimson); animation: shake .4s; }
#spell-input.correct { border-color: #3ddc97; }

#submit-btn {
  padding: 10px 28px; border-radius: 12px; border: none;
  background: linear-gradient(160deg, var(--gold), var(--gold-d));
  color: #1a1208; font-size: 16px; font-weight: 700; cursor: pointer;
  box-shadow: 0 4px 16px rgba(232,193,90,.3); letter-spacing: 1px;
  transition: transform .1s, box-shadow .1s;
}
#submit-btn:hover { box-shadow: 0 4px 22px rgba(232,193,90,.45); }
#submit-btn:active { transform: translateY(2px); }
#submit-btn:disabled { opacity: .4; cursor: not-allowed; }

/* ===== Battle log ===== */
#battle-log {
  width: 100%; max-width: 340px; max-height: 80px; overflow-y: auto;
  font-size: 12px; color: var(--dim); line-height: 1.6; text-align: center;
}
#battle-log .log-hit  { color: #f08080; }
#battle-log .log-crit { color: var(--gold); font-weight: 700; }
#battle-log .log-miss { color: var(--dim); }

/* ===== Combo display ===== */
#combo-display {
  font-size: 13px; color: var(--gold); letter-spacing: 2px;
  min-height: 20px; text-align: center;
}
#combo-display .big-combo {
  font-size: 22px; font-weight: 900; color: #ff6b3d;
  text-shadow: 0 0 16px rgba(255,107,61,.7);
}

/* ===== Particles ===== */
.particle {
  position: fixed; pointer-events: none; z-index: 999;
  font-weight: 900; font-size: 18px; animation: particle-fly .9s ease-out forwards;
  color: var(--gold); text-shadow: 0 0 8px rgba(232,193,90,.8);
}
@keyframes particle-fly {
  0%   { opacity: 1; transform: translate(0,0) scale(1); }
  30%  { opacity: 1; transform: translate(var(--dx), var(--dy)) scale(1.3); }
  100% { opacity: 0; transform: translate(var(--dx2), var(--dy2)) scale(.6); }
}

/* ===== Screen flash ===== */
.flash { animation: screen-flash .25s ease-out; }
@keyframes screen-flash {
  0%   { box-shadow: inset 0 0 80px rgba(255,255,255,.4); }
  100% { box-shadow: inset 0 0 0px rgba(255,255,255,0); }
}
.flash-bad { animation: screen-flash-bad .3s ease-out; }
@keyframes screen-flash-bad {
  0%   { box-shadow: inset 0 0 80px rgba(224,85,85,.5); }
  100% { box-shadow: inset 0 0 0px rgba(224,85,85,0); }
}
@keyframes shake {
  0%,100% { transform: translateX(0); }
  20%     { transform: translateX(-8px); }
  40%     { transform: translateX(8px); }
  60%     { transform: translateX(-5px); }
  80%     { transform: translateX(5px); }
}

/* ===== Overlay ===== */
#overlay {
  position: fixed; inset: 0; background: rgba(5,8,16,.82); backdrop-filter: blur(4px);
  z-index: 100; display: none; align-items: center; justify-content: center; padding: 20px;
}
#overlay.show { display: flex; }
.ov-panel {
  background: linear-gradient(165deg, #15224a, #0d1430 60%, #0a0f24);
  border: 1px solid var(--gold); border-radius: 18px;
  max-width: 440px; width: 100%; padding: 24px; text-align: center;
  box-shadow: 0 0 50px rgba(232,193,90,.2);
}
.ov-panel h2 { font-size: 22px; color: var(--gold); letter-spacing: 3px; margin-bottom: 8px; }
.ov-panel .ov-sub { font-size: 13px; color: var(--dim); margin-bottom: 14px; }
.ov-panel .ov-stat { font-size: 15px; color: #c0d8f0; margin: 6px 0; }
.ov-panel .ov-stat b { color: var(--gold); }
.ov-btn {
  display: inline-block; margin-top: 14px; padding: 10px 24px; border-radius: 12px; border: none;
  background: linear-gradient(160deg, var(--gold), var(--gold-d));
  color: #1a1208; font-size: 15px; font-weight: 700; cursor: pointer;
  box-shadow: 0 4px 16px rgba(232,193,90,.3); letter-spacing: 1px;
}
.ov-btn.ghost {
  background: linear-gradient(160deg, #1c2c58, #142048);
  color: var(--paper); border: 1px solid var(--line); box-shadow: none; margin-left: 8px;
}

/* ===== Bottom bar ===== */
#bottom-bar {
  text-align: center; padding: 12px 0 4px; border-top: 1px solid var(--line); margin-top: 10px;
}
.back-btn {
  display: inline-block; padding: 8px 20px; border-radius: 10px;
  border: 1px solid var(--line); background: rgba(255,255,255,.04);
  color: var(--dim); font-size: 13px; cursor: pointer; text-decoration: none;
  transition: background .15s, color .15s;
}
.back-btn:hover { background: rgba(255,255,255,.1); color: #fff; }

/* ===== Stage indicator ===== */
#stage-indicator {
  font-size: 12px; color: var(--jade-l); letter-spacing: 2px; text-align: center; margin-bottom: 4px;
}

/* ===== Responsive ===== */
@media (max-width: 720px) {
  #arena { flex-direction: column; }
  .fighter { flex-direction: row; flex-wrap: wrap; justify-content: center; gap: 8px; padding: 10px; }
  .fighter .avatar { width: 48px; height: 48px; font-size: 24px; }
  .fighter .name { font-size: 13px; }
  .hp-outer { width: 120px; }
  #center-zone { order: -1; }
}
</style>
</head>
<body>

<div class="wrap" id="app">
  <header>
    <h1>🌐 译灵堂 · 词汇对决</h1>
    <span class="sub">English Word Arena</span>
    <div class="hud">
      <div class="hud-chip"><b id="hud-score">0</b><span>道行</span></div>
      <div class="hud-chip"><b id="hud-stage">1</b><span>关卡</span></div>
    </div>
  </header>

  <div id="stage-indicator">第一关 · 炼气期番邦修士</div>

  <div id="arena">
    <!-- Player -->
    <div class="fighter player" id="player-panel">
      <div class="avatar">🧙</div>
      <div class="name">道友</div>
      <div class="hp-outer"><div class="hp-inner" id="player-hp-bar" style="width:100%"></div></div>
      <div class="hp-text"><span id="player-hp-text">100</span> / 100</div>
    </div>

    <!-- Center -->
    <div id="center-zone">
      <div id="timer-ring">
        <svg width="64" height="64" viewBox="0 0 64 64">
          <circle cx="32" cy="32" r="28" fill="none" stroke="rgba(255,255,255,.08)" stroke-width="4"/>
          <circle cx="32" cy="32" r="28" fill="none" stroke="var(--jade)" stroke-width="4"
            stroke-dasharray="175.93" stroke-dashoffset="0" stroke-linecap="round" id="timer-circle"/>
        </svg>
        <div class="t-text" id="timer-text">5</div>
      </div>

      <div id="word-card">
        <div class="en-word" id="en-word">---</div>
        <div class="phonetic" id="phonetic">/---/</div>
        <div class="cn-hint">释义首字：<b id="cn-hint">-</b></div>
      </div>

      <input type="text" id="spell-input" placeholder="输入英文拼写…" autocomplete="off" autocapitalize="off" spellcheck="false">
      <button id="submit-btn">斩妖！</button>

      <div id="combo-display"></div>
      <div id="battle-log"></div>
    </div>

    <!-- Enemy -->
    <div class="fighter enemy" id="enemy-panel">
      <div class="avatar" id="enemy-avatar">👹</div>
      <div class="name" id="enemy-name">番邦修士</div>
      <div class="hp-outer"><div class="hp-inner" id="enemy-hp-bar" style="width:100%"></div></div>
      <div class="hp-text"><span id="enemy-hp-text">100</span> / <span id="enemy-hp-max">100</span></div>
    </div>
  </div>

  <div id="bottom-bar">
    <a class="back-btn" href="../index.html">← 返回学院</a>
  </div>
</div>

<!-- Overlay: Victory / Defeat -->
<div id="overlay">
  <div class="ov-panel" id="ov-content"></div>
</div>

<script>
// ==================== VOCABULARY DATA ====================
// 25 high-school core English words (高一~高三)
const WORD_BANK = [
  { en: "abandon",    phonetic: "/əˈbændən/",    cn: "放弃；抛弃",       hint: "放" },
  { en: "ability",    phonetic: "/əˈbɪləti/",    cn: "能力；才能",       hint: "能" },
  { en: "abroad",     phonetic: "/əˈbrɔːd/",     cn: "在国外；到国外",    hint: "在" },
  { en: "absent",     phonetic: "/ˈæbsənt/",     cn: "缺席的；不在的",    hint: "缺" },
  { en: "absorb",     phonetic: "/əbˈzɔːrb/",    cn: "吸收；吸引",       hint: "吸" },
  { en: "abstract",   phonetic: "/ˈæbstrækt/",   cn: "抽象的；摘要",      hint: "抽" },
  { en: "abundant",   phonetic: "/əˈbʌndənt/",   cn: "丰富的；充裕的",    hint: "丰" },
  { en: "academic",   phonetic: "/ˌækəˈdemɪk/",  cn: "学术的；学院的",    hint: "学" },
  { en: "accelerate", phonetic: "/əkˈseləreɪt/", cn: "加速；促进",       hint: "加" },
  { en: "accept",     phonetic: "/əkˈsept/",     cn: "接受；承认",       hint: "接" },
  { en: "access",     phonetic: "/ˈækses/",      cn: "进入；通道；使用权",  hint: "进" },
  { en: "accompany",  phonetic: "/əˈkʌmpəni/",   cn: "陪伴；伴随",       hint: "陪" },
  { en: "accomplish", phonetic: "/əˈkɑːmplɪʃ/",  cn: "完成；实现",       hint: "完" },
  { en: "account",    phonetic: "/əˈkaʊnt/",     cn: "账户；解释；说明",   hint: "账" },
  { en: "accurate",   phonetic: "/ˈækjərət/",    cn: "准确的；精确的",    hint: "准" },
  { en: "achieve",    phonetic: "/əˈtʃiːv/",     cn: "达到；取得",       hint: "达" },
  { en: "acknowledge",phonetic: "/əkˈnɑːlɪdʒ/",  cn: "承认；感谢",       hint: "承" },
  { en: "acquire",    phonetic: "/əˈkwaɪər/",    cn: "获得；习得",       hint: "获" },
  { en: "adapt",      phonetic: "/əˈdæpt/",      cn: "适应；改编",       hint: "适" },
  { en: "adequate",   phonetic: "/ˈædɪkwət/",    cn: "足够的；适当的",    hint: "足" },
  { en: "adjust",     phonetic: "/əˈdʒʌst/",     cn: "调整；适应",       hint: "调" },
  { en: "admire",     phonetic: "/ədˈmaɪər/",    cn: "钦佩；赞赏",       hint: "钦" },
  { en: "admit",      phonetic: "/ədˈmɪt/",      cn: "承认；准许进入",    hint: "承" },
  { en: "adopt",      phonetic: "/əˈdɑːpt/",     cn: "采用；收养",       hint: "采" },
  { en: "advance",    phonetic: "/ədˈvæns/",     cn: "前进；推进；进步",   hint: "前" },
];

// Enemy stages
const ENEMY_STAGES = [
  { name: "炼气期番邦修士",  emoji: "👹", hp: 100, dmg: 12, bg: "rgba(224,85,85,.1)" },
  { name: "筑基期番邦修士",  emoji: "👺", hp: 150, dmg: 16, bg: "rgba(224,85,85,.15)" },
  { name: "金丹期番邦修士",  emoji: "👾", hp: 220, dmg: 20, bg: "rgba(224,85,85,.2)" },
  { name: "元婴期番邦老怪",  emoji: "🐉", hp: 300, dmg: 26, bg: "rgba(200,60,60,.25)" },
  { name: "化神期番邦老怪",  emoji: "💀", hp: 400, dmg: 32, bg: "rgba(200,60,60,.3)" },
];

// ==================== GAME STATE ====================
let state = {
  stage: 1,
  score: 0,
  playerHP: 100,
  playerMaxHP: 100,
  enemyHP: 100,
  enemyMaxHP: 100,
  combo: 0,
  maxCombo: 0,
  currentWord: null,
  usedWords: [],
  timerId: null,
  timeLeft: 5,
  canAnswer: true,
  gameOver: false,
};

// ==================== DOM REFS ====================
const $ = id => document.getElementById(id);
const dom = {
  get enWord()     { return $('en-word'); },
  get phonetic()   { return $('phonetic'); },
  get cnHint()     { return $('cn-hint'); },
  get spellInput() { return $('spell-input'); },
  get submitBtn()  { return $('submit-btn'); },
  get timerText()  { return $('timer-text'); },
  get timerCircle(){ return $('timer-circle'); },
  get comboDisplay(){ return $('combo-display'); },
  get battleLog()  { return $('battle-log'); },
  get playerHPBar(){ return $('player-hp-bar'); },
  get playerHPText(){ return $('player-hp-text'); },
  get enemyHPBar() { return $('enemy-hp-bar'); },
  get enemyHPText() { return $('enemy-hp-text'); },
  get enemyHPMax() { return $('enemy-hp-max'); },
  get enemyName()  { return $('enemy-name'); },
  get enemyAvatar(){ return $('enemy-avatar'); },
  get stageInd()   { return $('stage-indicator'); },
  get hudScore()   { return $('hud-score'); },
  get hudStage()   { return $('hud-stage'); },
  get overlay()    { return $('overlay'); },
  get ovContent()  { return $('ov-content'); },
  get playerPanel(){ return $('player-panel'); },
  get app()        { return $('app'); },
};

// ==================== UTILS ====================
function pickWord() {
  // Prefer unused words, reset when exhausted
  const available = WORD_BANK.filter(w => !state.usedWords.includes(w.en));
  const pool = available.length > 0 ? available : (() => { state.usedWords = []; return WORD_BANK; })();
  const idx = Math.floor(Math.random() * pool.length);
  const word = pool[idx];
  state.usedWords.push(word.en);
  return word;
}

function getEnemyForStage(stage) {
  const idx = Math.min(stage - 1, ENEMY_STAGES.length - 1);
  const base = ENEMY_STAGES[idx];
  // Scale HP beyond defined stages
  if (stage > ENEMY_STAGES.length) {
    const extra = (stage - ENEMY_STAGES.length) * 80;
    return { ...base, hp: base.hp + extra, name: `第${stage}关·番邦修士` };
  }
  return { ...base };
}

// ==================== RENDER ====================
function updateHPBars() {
  const pPct = Math.max(0, (state.playerHP / state.playerMaxHP) * 100);
  const ePct = Math.max(0, (state.enemyHP / state.enemyMaxHP) * 100);
  dom.playerHPBar.style.width = pPct + '%';
  dom.playerHPText.textContent = state.playerHP;
  dom.enemyHPBar.style.width = ePct + '%';
  dom.enemyHPText.textContent = Math.max(0, state.enemyHP);
}

function updateComboDisplay() {
  if (state.combo >= 3) {
    dom.comboDisplay.innerHTML = `<span class="big-combo">🔥 ${state.combo} 连击！伤害翻倍</span>`;
  } else if (state.combo >= 1) {
    dom.comboDisplay.innerHTML = `⚡ ${state.combo} 连击`;
  } else {
    dom.comboDisplay.innerHTML = '';
  }
}

function logMessage(msg, cls) {
  const div = document.createElement('div');
  div.className = cls || '';
  div.textContent = msg;
  dom.battleLog.appendChild(div);
  // Scroll to bottom
  dom.battleLog.scrollTop = dom.battleLog.scrollHeight;
  // Prune old
  while (dom.battleLog.children.length > 5) {
    dom.battleLog.removeChild(dom.battleLog.firstChild);
  }
}

// ==================== PARTICLES ====================
function spawnParticles(originEl, count, text, color) {
  const rect = originEl.getBoundingClientRect();
  const cx = rect.left + rect.width / 2;
  const cy = rect.top + rect.height / 2;
  for (let i = 0; i < count; i++) {
    const p = document.createElement('div');
    p.className = 'particle';
    p.textContent = text;
    const angle = (Math.PI * 2 * i) / count + (Math.random() - .5) * .8;
    const dist = 60 + Math.random() * 80;
    const dx  = Math.cos(angle) * dist;
    const dy  = Math.sin(angle) * dist - 40;
    const dx2 = dx * 1.6;
    const dy2 = dy * 1.6 - 30;
    p.style.cssText = `
      left: ${cx}px; top: ${cy}px; color: ${color};
      --dx: ${dx}px; --dy: ${dy}px; --dx2: ${dx2}px; --dy2: ${dy2}px;
    `;
    document.body.appendChild(p);
    setTimeout(() => p.remove(), 950);
  }
}

function flashScreen(good) {
  const el = dom.app;
  el.classList.remove('flash', 'flash-bad');
  void el.offsetWidth; // force reflow
  el.classList.add(good ? 'flash' : 'flash-bad');
  setTimeout(() => el.classList.remove('flash', 'flash-bad'), 350);
}

// ==================== TIMER ====================
const CIRCUMFERENCE = 2 * Math.PI * 28; // ≈ 175.93

function startTimer() {
  state.timeLeft = 5;
  dom.timerText.textContent = '5';
  dom.timerCircle.style.strokeDashoffset = '0';
  dom.timerCircle.style.stroke = 'var(--jade)';
  dom.timerText.style.color = 'var(--paper)';

  const startTime = Date.now();
  const totalMs = 5000;

  function tick() {
    if (state.gameOver || !state.canAnswer) return;
    const elapsed = Date.now() - startTime;
    const remaining = Math.max(0, totalMs - elapsed);
    const sec = Math.ceil(remaining / 1000);
    const fraction = remaining / totalMs;
    const offset = CIRCUMFERENCE * (1 - fraction);

    dom.timerText.textContent = sec;
    dom.timerCircle.style.strokeDashoffset = offset;

    if (fraction < 0.4) {
      dom.timerCircle.style.stroke = 'var(--gold)';
    }
    if (fraction < 0.2) {
      dom.timerCircle.style.stroke = 'var(--crimson)';
      dom.timerText.style.color = 'var(--crimson)';
    }

    if (remaining <= 0) {
      // Time's up!
      handleWrong("时辰已到！");
      return;
    }
    state.timerId = requestAnimationFrame(tick);
  }
  state.timerId = requestAnimationFrame(tick);
}

function stopTimer() {
  if (state.timerId) {
    cancelAnimationFrame(state.timerId);
    state.timerId = null;
  }
}

// ==================== GAME LOGIC ====================
function nextRound() {
  if (state.gameOver) return;
  state.canAnswer = true;
  state.currentWord = pickWord();

  dom.enWord.textContent = state.currentWord.en;
  dom.phonetic.textContent = state.currentWord.phonetic;
  dom.cnHint.textContent = state.currentWord.hint;
  dom.spellInput.value = '';
  dom.spellInput.className = '';
  dom.spellInput.focus();
  dom.submitBtn.disabled = false;

  startTimer();
}

function handleCorrect() {
  if (!state.canAnswer || state.gameOver) return;
  state.canAnswer = false;
  stopTimer();

  state.combo++;
  if (state.combo > state.maxCombo) state.maxCombo = state.combo;

  // Calculate damage
  let baseDamage = 25;
  if (state.combo >= 3) {
    baseDamage *= 2;
    logMessage(`💥 连击×${state.combo} 伤害翻倍！-${baseDamage}`, 'log-crit');
  } else {
    logMessage(`⚔ 剑气破译！-${baseDamage}`, 'log-hit');
  }

  state.enemyHP -= baseDamage;
  state.score += baseDamage;

  updateComboDisplay();
  updateHPBars();
  dom.hudScore.textContent = state.score;

  // Visual feedback
  dom.spellInput.className = 'correct';
  flashScreen(true);
  spawnParticles(dom.enemyAvatar, 10, '⚔', '#e8c15a');
  spawnParticles(dom.enemyAvatar, 6, '剑气破译！', '#5ee0c0');

  if (state.enemyHP <= 0) {
    state.enemyHP = 0;
    updateHPBars();
    victory();
    return;
  }

  // Next word after brief delay
  setTimeout(nextRound, 600);
}

function handleWrong(reason) {
  if (!state.canAnswer || state.gameOver) return;
  state.canAnswer = false;
  stopTimer();

  state.combo = 0;
  const enemyDmg = getEnemyForStage(state.stage).dmg;
  state.playerHP -= enemyDmg;

  updateComboDisplay();
  updateHPBars();

  // Visual feedback
  dom.spellInput.className = 'wrong';
  flashScreen(false);
  logMessage(`💢 ${reason || '拼写有误！'} 受到 ${enemyDmg} 点伤害`, 'log-miss');

  // Show correct answer
  dom.enWord.textContent = state.currentWord.en + '  ← 正解';
  dom.enWord.style.color = 'var(--crimson)';
  setTimeout(() => { dom.enWord.style.color = 'var(--gold)'; }, 800);

  if (state.playerHP <= 0) {
    state.playerHP = 0;
    updateHPBars();
    defeat();
    return;
  }

  setTimeout(nextRound, 900);
}

// ==================== VICTORY / DEFEAT ====================
function victory() {
  state.gameOver = true;
  stopTimer();

  const stageInfo = getEnemyForStage(state.stage);
  spawnParticles(dom.enemyAvatar, 18, '✨', '#f7e3a0');
  setTimeout(() => spawnParticles(dom.enemyAvatar, 14, '道果+1', '#5ee0c0'), 400);

  setTimeout(() => {
    dom.overlay.classList.add('show');
    dom.ovContent.innerHTML = `
      <h2>🏆 斩杀成功！</h2>
      <div class="ov-sub">${stageInfo.name} 已被你的剑气击败</div>
      <div class="ov-stat">最大连击：<b>${state.maxCombo}</b></div>
      <div class="ov-stat">本关得分：<b>${state.score}</b></div>
      <div class="ov-stat"><b>道果 +1</b> · 词汇功力精进！</div>
      <button class="ov-btn" id="btn-next">进入下一关 →</button>
      <button class="ov-btn ghost" id="btn-replay">重新挑战本关</button>
      <div style="margin-top:12px;">
        <a class="back-btn" href="../index.html">← 返回学院</a>
      </div>
    `;
    $('btn-next').onclick = nextStage;
    $('btn-replay').onclick = restartStage;
  }, 700);
}

function defeat() {
  state.gameOver = true;
  stopTimer();

  setTimeout(() => {
    dom.overlay.classList.add('show');
    dom.ovContent.innerHTML = `
      <h2>💀 灵气溃散…</h2>
      <div class="ov-sub">你被番邦修士击败，需回洞府调息</div>
      <div class="ov-stat">到达关卡：<b>第 ${state.stage} 关</b></div>
      <div class="ov-stat">最大连击：<b>${state.maxCombo}</b></div>
      <div class="ov-stat">总得分：<b>${state.score}</b></div>
      <button class="ov-btn" id="btn-retry">不服再战！</button>
      <button class="ov-btn ghost" id="btn-reset">重头修起</button>
      <div style="margin-top:12px;">
        <a class="back-btn" href="../index.html">← 返回学院</a>
      </div>
    `;
    $('btn-retry').onclick = restartStage;
    $('btn-reset').onclick = fullReset;
  }, 500);
}

function nextStage() {
  dom.overlay.classList.remove('show');
  state.stage++;
  state.maxCombo = 0;
  state.usedWords = [];
  const enemy = getEnemyForStage(state.stage);
  state.enemyHP = enemy.hp;
  state.enemyMaxHP = enemy.hp;
  state.playerHP = state.playerMaxHP;
  state.gameOver = false;

  dom.enemyName.textContent = enemy.name;
  dom.enemyAvatar.textContent = enemy.emoji;
  dom.enemyHPMax.textContent = enemy.hp;
  dom.hudStage.textContent = state.stage;
  dom.stageInd.textContent = `第${state.stage}关 · ${enemy.name}`;
  dom.battleLog.innerHTML = '';

  updateHPBars();
  updateComboDisplay();
  nextRound();
}

function restartStage() {
  dom.overlay.classList.remove('show');
  state.maxCombo = 0;
  state.combo = 0;
  state.score = 0;
  state.usedWords = [];
  const enemy = getEnemyForStage(state.stage);
  state.enemyHP = enemy.hp;
  state.enemyMaxHP = enemy.hp;
  state.playerHP = state.playerMaxHP;
  state.gameOver = false;

  dom.enemyName.textContent = enemy.name;
  dom.enemyAvatar.textContent = enemy.emoji;
  dom.enemyHPMax.textContent = enemy.hp;
  dom.stageInd.textContent = `第${state.stage}关 · ${enemy.name}`;
  dom.hudScore.textContent = '0';
  dom.hudStage.textContent = state.stage;
  dom.battleLog.innerHTML = '';

  updateHPBars();
  updateComboDisplay();
  nextRound();
}

function fullReset() {
  dom.overlay.classList.remove('show');
  state.stage = 1;
  state.score = 0;
  state.combo = 0;
  state.maxCombo = 0;
  state.playerHP = 100;
  state.playerMaxHP = 100;
  state.usedWords = [];
  state.gameOver = false;

  const enemy = getEnemyForStage(1);
  state.enemyHP = enemy.hp;
  state.enemyMaxHP = enemy.hp;

  dom.enemyName.textContent = enemy.name;
  dom.enemyAvatar.textContent = enemy.emoji;
  dom.enemyHPMax.textContent = enemy.hp;
  dom.hudScore.textContent = '0';
  dom.hudStage.textContent = '1';
  dom.stageInd.textContent = '第一关 · 炼气期番邦修士';
  dom.battleLog.innerHTML = '';

  updateHPBars();
  updateComboDisplay();
  nextRound();
}

// ==================== EVENT BINDING ====================
dom.submitBtn.addEventListener('click', () => {
  if (!state.canAnswer || state.gameOver) return;
  const answer = dom.spellInput.value.trim().toLowerCase();
  const correct = state.currentWord.en.toLowerCase();
  if (answer === correct) {
    handleCorrect();
  } else {
    handleWrong("拼写有误！");
  }
});

dom.spellInput.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') {
    e.preventDefault();
    dom.submitBtn.click();
  }
});

// ==================== INIT ====================
function init() {
  const enemy = getEnemyForStage(1);
  state.enemyHP = enemy.hp;
  state.enemyMaxHP = enemy.hp;
  state.playerHP = state.playerMaxHP;

  dom.enemyName.textContent = enemy.name;
  dom.enemyAvatar.textContent = enemy.emoji;
  dom.enemyHPMax.textContent = enemy.hp;
  dom.stageInd.textContent = '第一关 · 炼气期番邦修士';

  updateHPBars();
  updateComboDisplay();
  nextRound();
}

document.addEventListener('DOMContentLoaded', init);
</script>
